name: Coletar finanças e documentos de pessoal

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Máximo de registros por página de cada fonte"
        required: false
        default: "50"
        type: choice
        options:
          - "10"
          - "25"
          - "50"
          - "500"
          - "100"
      max_pages:
        description: "Quantidade de páginas por fonte"
        required: false
        default: "3"
        type: choice
        options:
          - "1"
          - "3"
          - "5"
          - "20"
          - "50"
      resource:
        description: "Recurso a coletar (all executa todos)"
        required: false
        default: "all"
        type: choice
        options:
          - "all"
          - "transferegov-only"
          - "bahia-state-only"
          - "balancetes"
          - "pdc-contas-anuais"
          - "pdc-receita-tributaria"
          - "pdc-recursos-extraordinarios"
          - "pdc-resumo-execucao-da-receita"
          - "pdc-resumo-execucao-da-despesa"
          - "pdc-transferencia"
          - "pdc-emendas-parlamentares-receitas"
          - "pdc-convenios-transferencias-realizadas"
          - "pdc-obras-pdc"
          - "contratos"
          - "processos"
          - "rreo"
          - "rgf"
          - "servidores"
      include_transferegov:
        description: "Preservar também propostas e parcerias destinadas a Barreiras"
        required: false
        default: true
        type: boolean
      include_transferegov_historical_proposals:
        description: "Baixar o ZIP histórico nacional e recortar Barreiras desde 2021"
        required: false
        default: false
        type: boolean
      include_transferegov_historical_amendments:
        description: "Cruzar o ZIP oficial de emendas com propostas preservadas de Barreiras"
        required: false
        default: false
        type: boolean
      include_bahia_state_amendments:
        description: "Preservar o catálogo e o ZIP oficial de emendas estaduais da Bahia"
        required: false
        default: true
        type: boolean
      include_bahia_special_transfers:
        description: "Preservar o ZIP oficial de Transferências Especiais da Bahia"
        required: false
        default: true
        type: boolean
      include_bahia_state_loa_amendments:
        description: "Preservar anexos anuais da LOA da Bahia com município e autor"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: municipal-finance-collection-production
  cancel-in-progress: false

jobs:
  collect:
    if: >-
      github.event_name == 'schedule' ||
      (
        inputs.resource != 'transferegov-only' &&
        inputs.resource != 'bahia-state-only'
      )
    name: Preservar catálogo municipal (${{ matrix.resource }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # O plano gratuito limita as conexões simultâneas da role de coleta.
      # Oito jobs em paralelo faziam todos chegarem ao banco ao mesmo tempo
      # e produziam "too many connections" antes de persistir o documento.
      # Em execuÃ§Ã£o direcionada, somente um job coleta; os demais podem
      # verificar a condiÃ§Ã£o em paralelo. No agendamento completo, mantemos
      # uma conexÃ£o de coleta por vez para respeitar o plano gratuito.
      max-parallel: ${{ (inputs.resource == 'all' || inputs.resource == '') && 1 || 8 }}
      matrix:
        # GitHub does not expose `matrix` inside jobs.<job>.if. Build the
        # matrix from the dispatch input instead, so a directed run creates
        # exactly one job while schedules still cover every resource.
        resource: >-
          ${{ fromJSON(
            (inputs.resource == '' || inputs.resource == 'all')
              && '["balancetes","pdc-contas-anuais","pdc-receita-tributaria","pdc-recursos-extraordinarios","pdc-resumo-execucao-da-receita","pdc-resumo-execucao-da-despesa","pdc-transferencia","pdc-emendas-parlamentares-receitas","pdc-convenios-transferencias-realizadas","pdc-obras-pdc","contratos","processos","rreo","rgf","servidores"]'
              || format('["{0}"]', inputs.resource)
          ) }}
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: workers/collectors/src
      PERSISTENCE_MODE: postgres-supabase
      DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
      SUPABASE_URL: ${{ vars.QUERIDO_DIARIO_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.QUERIDO_DIARIO_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_WORKLOAD_EMAIL: ${{ secrets.MUNICIPAL_TRANSPARENCY_SUPABASE_WORKLOAD_EMAIL }}
      SUPABASE_WORKLOAD_PASSWORD: ${{ secrets.MUNICIPAL_TRANSPARENCY_SUPABASE_WORKLOAD_PASSWORD }}
      SUPABASE_RAW_ARTIFACTS_BUCKET: raw-artifacts
      MUNICIPAL_TRANSPARENCY_REQUESTS_PER_MINUTE: "10"
      MUNICIPAL_TRANSPARENCY_MAX_BODY_BYTES: "16777216"
      MUNICIPAL_TRANSPARENCY_DOCUMENT_REQUESTS_PER_MINUTE: "6"
      # RelatÃ³rios fiscais podem exceder 64 MiB; o limite continua explÃ­cito
      # e abaixo do mÃ¡ximo defensivo do coletor (256 MiB).
      MUNICIPAL_TRANSPARENCY_MAX_DOCUMENT_BYTES: "268435456"
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências fixadas
        run: python -m pip install --disable-pip-version-check ".[postgres,storage]"

      - name: Verificar CA oficial do Supabase
        run: >-
          echo "700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7  config/certificates/supabase-prod-ca-2021.crt"
          | sha256sum --check --strict

      - name: Preservar catálogo municipal
        env:
          COLLECT_LIMIT: >-
            ${{ (matrix.resource == 'balancetes' || matrix.resource == 'servidores') && '500' || inputs.limit || '50' }}
          COVERAGE_ARGUMENTS: >-
            ${{ matrix.resource == 'balancetes' && '--coverage-year-from 2021' || '' }}
        run: >-
          python -B -m barreiras_collectors.commands.collect_municipal_transparency
          --source prefeitura
          --resource "${{ matrix.resource }}"
          --limit "$COLLECT_LIMIT"
          --max-pages "${{ inputs.max_pages || '3' }}"
          --allow-partial
          $COVERAGE_ARGUMENTS

      - name: Drenar documentos municipais
        # Processos licitatórios são linhas estruturadas sem URL de PDF; o
        # download de documentos não se aplica e o comando o recusaria.
        if: matrix.resource != 'processos'
        env:
          DRAIN_LIMIT: >-
            ${{ (matrix.resource == 'balancetes' || matrix.resource == 'servidores') && '500' || inputs.limit || '50' }}
          DRAIN_MAX_DOCUMENTS: >-
            ${{ (matrix.resource == 'balancetes' || matrix.resource == 'servidores') && '5' || inputs.limit || '50' }}
          DRAIN_MAX_PAGES: >-
            ${{ (matrix.resource == 'balancetes' || matrix.resource == 'servidores') && '1' || inputs.max_pages || '3' }}
        run: >-
          python -B -m barreiras_collectors.commands.collect_municipal_transparency
          --source prefeitura
          --resource "${{ matrix.resource }}"
          --limit "$DRAIN_LIMIT"
          --max-pages "$DRAIN_MAX_PAGES"
          --max-documents "$DRAIN_MAX_DOCUMENTS"
          --download-documents
          --allow-partial

  transferegov:
    name: Preservar emendas federais e parcerias
    needs: collect
    if: >-
      always() &&
      inputs.resource != 'bahia-state-only' &&
      (
        github.event_name == 'schedule' ||
        inputs.include_transferegov == true ||
        inputs.resource == 'transferegov-only'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: workers/collectors/src
      PERSISTENCE_MODE: postgres-supabase
      DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
      SUPABASE_URL: ${{ vars.QUERIDO_DIARIO_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.QUERIDO_DIARIO_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_WORKLOAD_EMAIL: ${{ secrets.MUNICIPAL_TRANSPARENCY_SUPABASE_WORKLOAD_EMAIL }}
      SUPABASE_WORKLOAD_PASSWORD: ${{ secrets.MUNICIPAL_TRANSPARENCY_SUPABASE_WORKLOAD_PASSWORD }}
      SUPABASE_RAW_ARTIFACTS_BUCKET: raw-artifacts
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências fixadas
        run: python -m pip install --disable-pip-version-check ".[postgres,storage]"

      - name: Verificar CA oficial do Supabase
        run: >-
          echo "700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7  config/certificates/supabase-prod-ca-2021.crt"
          | sha256sum --check --strict

      - name: Preservar catálogo histórico do Transferegov
        run: >-
          python -B -m
          barreiras_collectors.commands.collect_transferegov_download_catalog

      - name: Preservar propostas históricas de Barreiras
        if: github.event_name == 'workflow_dispatch' && inputs.include_transferegov_historical_proposals == true
        run: >-
          python -B -m
          barreiras_collectors.commands.collect_transferegov_historical_proposals
          --year-from "2021"

      - name: Preservar emendas históricas ligadas a Barreiras
        if: github.event_name == 'workflow_dispatch' && inputs.include_transferegov_historical_amendments == true
        run: >-
          python -B -m
          barreiras_collectors.commands.collect_transferegov_historical_amendments
          --year-from "2021"

      - name: Preservar execução federal de emendas em Barreiras
        run: >-
          python -B -m
          barreiras_collectors.commands.collect_cgu_federal_amendments

      - name: Preservar documentos anuais das emendas federais
        run: >-
          python -B -m
          barreiras_collectors.commands.collect_cgu_federal_amendment_documents
          --year-from "2021"

      - name: Preservar retrato do Transferegov
        run: >-
          python -B -m barreiras_collectors.commands.collect_transferegov_parcerias
          --year-from "2021"
          --page-size "${{ inputs.limit || '50' }}"

  bahia_state_amendments:
    name: Preservar emendas estaduais da Bahia
    # Os jobs complementares usam a mesma role PostgreSQL no plano gratuito.
    # Encadeá-los evita que Transferegov, FIPLAN e LOA abram conexões ao
    # mesmo tempo depois que a matriz municipal termina.
    needs:
      - collect
      - transferegov
    if: >-
      always() &&
      (
        inputs.resource == 'bahia-state-only' ||
        (
          inputs.resource != 'transferegov-only' &&
          (
            github.event_name == 'schedule' ||
            inputs.include_bahia_state_amendments == true
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: workers/collectors/src:workers/normalization/src
      PERSISTENCE_MODE: postgres-supabase
      DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
      SUPABASE_URL: ${{ vars.QUERIDO_DIARIO_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.QUERIDO_DIARIO_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_WORKLOAD_EMAIL: ${{ secrets.MUNICIPAL_TRANSPARENCY_SUPABASE_WORKLOAD_EMAIL }}
      SUPABASE_WORKLOAD_PASSWORD: ${{ secrets.MUNICIPAL_TRANSPARENCY_SUPABASE_WORKLOAD_PASSWORD }}
      SUPABASE_RAW_ARTIFACTS_BUCKET: raw-artifacts
      BAHIA_STATE_TLS_CA_BUNDLE: config/certificates/sectigo-public-server-authentication-ov-r36-chain.pem
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências fixadas
        run: python -m pip install --disable-pip-version-check ".[postgres,storage]"

      - name: Verificar cadeia TLS oficial da fonte estadual
        run: >-
          echo "729b16d606ab35a0ca027fce556f9b35913d4553f1f9b6e88ba331625519d333  config/certificates/sectigo-public-server-authentication-ov-r36-chain.pem"
          | sha256sum --check --strict

      - name: Verificar CA oficial do Supabase
        run: >-
          echo "700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7  config/certificates/supabase-prod-ca-2021.crt"
          | sha256sum --check --strict

      - name: Preservar catálogo e ZIP estaduais
        run: >-
          python -B -m
          barreiras_collectors.commands.collect_bahia_state_amendments

      - name: Normalizar execução estadual agregada
        run: >-
          python -B -m
          barreiras_normalization.commands.process_bahia_state_execution
          --limit "1"

  bahia_special_transfers:
    name: Preservar transferências especiais da Bahia
    needs:
      - collect
      - transferegov
      - bahia_state_amendments
    if: >-
      always() &&
      (
        inputs.resource == 'bahia-state-only' ||
        (
          inputs.resource != 'transferegov-only' &&
          (
            github.event_name == 'schedule' ||
            inputs.include_bahia_special_transfers == true
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: workers/collectors/src:workers/normalization/src
      PERSISTENCE_MODE: postgres-supabase
      DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
      SUPABASE_URL: ${{ vars.QUERIDO_DIARIO_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.QUERIDO_DIARIO_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_WORKLOAD_EMAIL: ${{ secrets.MUNICIPAL_TRANSPARENCY_SUPABASE_WORKLOAD_EMAIL }}
      SUPABASE_WORKLOAD_PASSWORD: ${{ secrets.MUNICIPAL_TRANSPARENCY_SUPABASE_WORKLOAD_PASSWORD }}
      SUPABASE_RAW_ARTIFACTS_BUCKET: raw-artifacts
      BAHIA_STATE_TLS_CA_BUNDLE: config/certificates/sectigo-public-server-authentication-ov-r36-chain.pem
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências fixadas
        run: python -m pip install --disable-pip-version-check ".[postgres,storage]"

      - name: Verificar cadeia TLS oficial da fonte estadual
        run: >-
          echo "729b16d606ab35a0ca027fce556f9b35913d4553f1f9b6e88ba331625519d333  config/certificates/sectigo-public-server-authentication-ov-r36-chain.pem"
          | sha256sum --check --strict

      - name: Verificar CA oficial do Supabase
        run: >-
          echo "700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7  config/certificates/supabase-prod-ca-2021.crt"
          | sha256sum --check --strict

      - name: Preservar catálogo e ZIP de Transferências Especiais
        run: >-
          python -B -m
          barreiras_collectors.commands.collect_bahia_special_transfers

      - name: Normalizar pagamentos que mencionam Barreiras
        run: >-
          python -B -m
          barreiras_normalization.commands.process_bahia_special_transfers
          --limit "1"

  bahia_state_loa_amendments:
    name: Preservar anexos territoriais da LOA da Bahia
    needs:
      - collect
      - transferegov
      - bahia_state_amendments
      - bahia_special_transfers
    if: >-
      always() &&
      (
        inputs.resource == 'bahia-state-only' ||
        (
          inputs.resource != 'transferegov-only' &&
          (
            github.event_name == 'schedule' ||
            inputs.include_bahia_state_loa_amendments == true
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: workers/collectors/src:workers/document-processing/src
      PERSISTENCE_MODE: postgres-supabase
      DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
      SUPABASE_URL: ${{ vars.QUERIDO_DIARIO_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.QUERIDO_DIARIO_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_WORKLOAD_EMAIL: ${{ secrets.MUNICIPAL_TRANSPARENCY_SUPABASE_WORKLOAD_EMAIL }}
      SUPABASE_WORKLOAD_PASSWORD: ${{ secrets.MUNICIPAL_TRANSPARENCY_SUPABASE_WORKLOAD_PASSWORD }}
      SUPABASE_RAW_ARTIFACTS_BUCKET: raw-artifacts
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências fixadas
        run: python -m pip install --disable-pip-version-check ".[postgres,storage,pdf]"

      - name: Verificar CA oficial do Supabase
        run: >-
          echo "700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7  config/certificates/supabase-prod-ca-2021.crt"
          | sha256sum --check --strict

      - name: Preservar anexos da LOA por município e autor
        run: >-
          python -B -m
          barreiras_collectors.commands.collect_bahia_state_loa_amendments
          --year-from "2021"
          --year-to "2026"

      - name: Extrair valores autorizados destinados a Barreiras
        run: >-
          python -B -m
          barreiras_docproc.commands.process_bahia_state_loa
          --limit "10"
