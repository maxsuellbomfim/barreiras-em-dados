name: Coletar documentos financeiros municipais

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-finance-documents-production
  cancel-in-progress: false

jobs:
  collect:
    name: Preservar catalogo financeiro (${{ matrix.resource }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        resource:
          - pdc-receita-tributaria
          - pdc-recursos-extraordinarios
          - pdc-resumo-execucao-da-receita
          - pdc-resumo-execucao-da-despesa
          - pdc-transferencia
          - pdc-emendas-parlamentares-receitas
          - rreo
          - rgf
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: workers/collectors/src
      PERSISTENCE_MODE: postgres-supabase
      DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
      SUPABASE_URL: ${{ vars.QUERIDO_DIARIO_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.QUERIDO_DIARIO_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_WORKLOAD_EMAIL: ${{ secrets.MUNICIPAL_TRANSPARENCY_SUPABASE_WORKLOAD_EMAIL }}
      SUPABASE_WORKLOAD_PASSWORD: ${{ secrets.MUNICIPAL_TRANSPARENCY_SUPABASE_WORKLOAD_PASSWORD }}
      SUPABASE_RAW_ARTIFACTS_BUCKET: raw-artifacts
      MUNICIPAL_TRANSPARENCY_REQUESTS_PER_MINUTE: "10"
      MUNICIPAL_TRANSPARENCY_MAX_BODY_BYTES: "16777216"
      MUNICIPAL_TRANSPARENCY_DOCUMENT_REQUESTS_PER_MINUTE: "6"
      MUNICIPAL_TRANSPARENCY_MAX_DOCUMENT_BYTES: "67108864"
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências fixadas
        run: python -m pip install --disable-pip-version-check ".[postgres,storage]"

      - name: Verificar CA oficial do Supabase
        run: >-
          echo "700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7  config/certificates/supabase-prod-ca-2021.crt"
          | sha256sum --check --strict

      - name: Preservar documento financeiro
        run: >-
          python -B -m barreiras_collectors.commands.collect_municipal_transparency
          --source prefeitura
          --resource "${{ matrix.resource }}"
          --limit 50
          --max-pages 3
          --download-documents
          --allow-partial
