name: Coletar cadastro PNCP

on:
  schedule:
    # Semanal: cadastro e contratações da última semana.
    - cron: "13 9 * * 1"
    # Diário: uma janela retroativa de contratações até jul/2021.
    - cron: "43 5 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Escopo da execução manual"
        required: false
        default: full
        type: choice
        options:
          - full
          - backfill
          - contracts_only
          - items_only
          - replay_window
          - discovery_only
          - registry_only
          - municipal_link_evidence
          - publication_evidence
      publication_page:
        description: "Página da consulta privada por publicação (1–100; janela até 7 dias)"
        required: false
        default: "1"
        type: string
      publish_social_fund:
        description: "Publicar somente o par revisado 130/2026 + IN-029/2026 (modo municipal_link_evidence)"
        required: false
        default: false
        type: boolean
      replay_since:
        description: "Início da janela manual para replay (YYYY-MM-DD)"
        required: false
        default: ""
        type: string
      replay_until:
        description: "Fim da janela manual para replay (YYYY-MM-DD)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: collect-pncp-registry-production
  cancel-in-progress: false

jobs:
  collect:
    name: Preservar cadastro do PNCP
    runs-on: ubuntu-latest
    # A API de consulta degradada chega a 60s por resposta; 13 modalidades
    # com retentativas não cabem mais em 10 minutos.
    timeout-minutes: 20
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: workers/collectors/src
      PERSISTENCE_MODE: postgres-supabase
      DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
      SUPABASE_URL: ${{ vars.QUERIDO_DIARIO_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.QUERIDO_DIARIO_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_WORKLOAD_EMAIL: ${{ secrets.QUERIDO_DIARIO_SUPABASE_WORKLOAD_EMAIL }}
      SUPABASE_WORKLOAD_PASSWORD: ${{ secrets.QUERIDO_DIARIO_SUPABASE_WORKLOAD_PASSWORD }}
      SUPABASE_RAW_ARTIFACTS_BUCKET: raw-artifacts

    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências fixadas
        run: python -m pip install --disable-pip-version-check ".[postgres,storage]"

      - name: Verificar CA oficial do Supabase
        run: >-
          echo "700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7  config/certificates/supabase-prod-ca-2021.crt"
          | sha256sum --check --strict

      - name: Preservar cadastro
        id: collect_registry
        if: github.event.schedule != '43 5 * * *' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'full' || inputs.mode == 'registry_only')
        continue-on-error: true
        run: >-
          python -B -m barreiras_collectors.commands.collect_pncp_registry

      - name: Preservar vínculo municipal privado
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'municipal_link_evidence'
        run: >-
          python -B -m barreiras_collectors.commands.collect_pncp_municipal_link_evidence

      - name: Publicar par revisado do Fundo Social
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'municipal_link_evidence' && inputs.publish_social_fund
        run: >-
          python -B -m barreiras_collectors.commands.publish_pncp_social_fund

      - name: Preservar página privada por publicação
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publication_evidence'
        env:
          PNCP_REPLAY_SINCE: ${{ inputs.replay_since }}
          PNCP_REPLAY_UNTIL: ${{ inputs.replay_until }}
          PNCP_PUBLICATION_PAGE: ${{ inputs.publication_page }}
        run: |
          test -n "$PNCP_REPLAY_SINCE"
          test -n "$PNCP_REPLAY_UNTIL"
          python -B -m barreiras_collectors.commands.collect_pncp_publication_evidence \
            --since "$PNCP_REPLAY_SINCE" \
            --until "$PNCP_REPLAY_UNTIL" \
            --page "$PNCP_PUBLICATION_PAGE"

      - name: Preservar contratações da última semana
        id: collect_weekly
        continue-on-error: true
        if: github.event.schedule != '43 5 * * *' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'full')
        run: >-
          python -B -m barreiras_collectors.commands.collect_pncp_contratacoes

      - name: Backfill retroativo de contratações
        id: collect_backfill
        continue-on-error: true
        if: github.event.schedule == '43 5 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'full' || inputs.mode == 'backfill'))
        run: >-
          python -B -m barreiras_collectors.commands.collect_pncp_contratacoes
          --backfill

      - name: Reprocessar janela PNCP
        id: collect_replay
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'replay_window' || inputs.mode == 'discovery_only')
        env:
          PNCP_REPLAY_SINCE: ${{ inputs.replay_since }}
          PNCP_REPLAY_UNTIL: ${{ inputs.replay_until }}
        run: |
          test -n "$PNCP_REPLAY_SINCE"
          test -n "$PNCP_REPLAY_UNTIL"
          python -B -m barreiras_collectors.commands.collect_pncp_contratacoes \
            --since "$PNCP_REPLAY_SINCE" \
            --until "$PNCP_REPLAY_UNTIL"

      - name: Diagnosticar rede PNCP sem persistir
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'discovery_only' && steps.collect_replay.outcome == 'failure'
        continue-on-error: true
        env:
          PNCP_REPLAY_SINCE: ${{ inputs.replay_since }}
          PNCP_REPLAY_UNTIL: ${{ inputs.replay_until }}
        run: |
          [[ "$PNCP_REPLAY_SINCE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "$PNCP_REPLAY_UNTIL" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          since="${PNCP_REPLAY_SINCE//-/}"
          until="${PNCP_REPLAY_UNTIL//-/}"
          echo 'Sondagem de uma página/modalidade; não comprova cobertura nem altera a falha registrada.'
          curl --silent --show-error --proto '=https' --connect-timeout 10 --max-time 20 \
            --header 'Accept: application/json' \
            --header 'User-Agent: BarreirasEmDados-Collector/0.1' \
            --output /dev/null \
            --write-out 'pncp_network_probe http=%{http_code} dns=%{time_namelookup} connect=%{time_connect} tls=%{time_appconnect} first_byte=%{time_starttransfer} total=%{time_total}\n' \
            "https://pncp.gov.br/api/consulta/v1/contratacoes/publicacao?dataInicial=${since}&dataFinal=${until}&cnpj=13654405000195&codigoModalidadeContratacao=1&pagina=1&tamanhoPagina=50"

      - name: Preservar itens e resultados das contratações
        id: collect_items
        if: github.event_name != 'workflow_dispatch' || (inputs.mode != 'contracts_only' && inputs.mode != 'registry_only' && inputs.mode != 'municipal_link_evidence' && inputs.mode != 'publication_evidence' && inputs.mode != 'discovery_only')
        continue-on-error: true
        run: >-
          python -B -m barreiras_collectors.commands.collect_pncp_itens

      - name: Preservar contratos e empenhos das contratações
        id: collect_contracts
        if: github.event_name != 'workflow_dispatch' || (inputs.mode != 'registry_only' && inputs.mode != 'municipal_link_evidence' && inputs.mode != 'items_only' && inputs.mode != 'publication_evidence' && inputs.mode != 'discovery_only')
        continue-on-error: true
        run: |
          status=0
          python -B -m barreiras_collectors.commands.collect_pncp_contratos || status=$?
          if [ "$status" = "2" ]; then
            echo "::warning::Lote PNCP consultado; cobertura parcial e fila de reconsulta mantidas. Consulte as pendências na plataforma."
            echo "### PNCP: lote consultado, cobertura ainda parcial" >> "$GITHUB_STEP_SUMMARY"
            echo "As compras selecionadas tiveram resposta preservada. A fila pode conter pendências herdadas e contratos ainda não publicados. Isso não comprova cobertura completa nem inexistência de contratos." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$status"

      - name: Normalizar contratos PNCP
        if: github.event_name != 'workflow_dispatch' || (inputs.mode != 'registry_only' && inputs.mode != 'municipal_link_evidence' && inputs.mode != 'publication_evidence' && inputs.mode != 'discovery_only')
        run: >-
          python -B -m barreiras_collectors.commands.normalize_pncp_contracts
          --limit 500

      - name: Sinalizar falha parcial da coleta
        if: always()
        env:
          PNCP_REGISTRY_OUTCOME: ${{ steps.collect_registry.outcome }}
          PNCP_WEEKLY_OUTCOME: ${{ steps.collect_weekly.outcome }}
          PNCP_BACKFILL_OUTCOME: ${{ steps.collect_backfill.outcome }}
          PNCP_REPLAY_OUTCOME: ${{ steps.collect_replay.outcome }}
          PNCP_ITEMS_OUTCOME: ${{ steps.collect_items.outcome }}
          PNCP_CONTRACTS_OUTCOME: ${{ steps.collect_contracts.outcome }}
        run: |
          status=0
          if [ "$PNCP_WEEKLY_OUTCOME" = "failure" ] || [ "$PNCP_BACKFILL_OUTCOME" = "failure" ] || [ "$PNCP_REPLAY_OUTCOME" = "failure" ]; then
            echo "::error::A descoberta de contratações falhou ou ficou incompleta; as etapas independentes foram mantidas, sem declarar cobertura completa."
            status=1
          fi
          if [ "$PNCP_REGISTRY_OUTCOME" = "failure" ]; then
            echo "::error::A coleta do cadastro PNCP falhou; a falha permanece registrada independentemente das demais etapas."
            status=1
          fi
          if [ "$PNCP_ITEMS_OUTCOME" = "failure" ]; then
            echo "::error::A coleta de itens/resultados do PNCP falhou; a falha permanece registrada independentemente das demais etapas."
            status=1
          fi
          if [ "$PNCP_CONTRACTS_OUTCOME" = "failure" ]; then
            echo "::error::A coleta de contratos/empenhos do PNCP falhou; a falha permanece registrada independentemente das demais etapas."
            status=1
          fi
          exit "$status"
