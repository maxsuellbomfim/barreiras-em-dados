name: Coletar cadastro PNCP

on:
  schedule:
    # Semanal: cadastro e contratações da última semana.
    - cron: "13 9 * * 1"
    # Diário: uma janela retroativa de contratações até jul/2021.
    - cron: "43 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: collect-pncp-registry-production
  cancel-in-progress: false

jobs:
  collect:
    name: Preservar cadastro do PNCP
    runs-on: ubuntu-latest
    # A API de consulta degradada chega a 60s por resposta; 13 modalidades
    # com retentativas não cabem mais em 10 minutos.
    timeout-minutes: 20
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: workers/collectors/src
      PERSISTENCE_MODE: postgres-supabase
      DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
      SUPABASE_URL: ${{ vars.QUERIDO_DIARIO_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.QUERIDO_DIARIO_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_WORKLOAD_EMAIL: ${{ secrets.QUERIDO_DIARIO_SUPABASE_WORKLOAD_EMAIL }}
      SUPABASE_WORKLOAD_PASSWORD: ${{ secrets.QUERIDO_DIARIO_SUPABASE_WORKLOAD_PASSWORD }}
      SUPABASE_RAW_ARTIFACTS_BUCKET: raw-artifacts

    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências fixadas
        run: python -m pip install --disable-pip-version-check ".[postgres,storage]"

      - name: Verificar CA oficial do Supabase
        run: >-
          echo "700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7  config/certificates/supabase-prod-ca-2021.crt"
          | sha256sum --check --strict

      - name: Preservar cadastro
        if: github.event.schedule != '43 5 * * *'
        run: >-
          python -B -m barreiras_collectors.commands.collect_pncp_registry

      - name: Preservar contratações da última semana
        if: github.event.schedule != '43 5 * * *'
        run: >-
          python -B -m barreiras_collectors.commands.collect_pncp_contratacoes

      - name: Backfill retroativo de contratações
        if: github.event.schedule == '43 5 * * *' || github.event_name == 'workflow_dispatch'
        run: >-
          python -B -m barreiras_collectors.commands.collect_pncp_contratacoes
          --backfill

      - name: Preservar itens e resultados das contratações
        run: >-
          python -B -m barreiras_collectors.commands.collect_pncp_itens
