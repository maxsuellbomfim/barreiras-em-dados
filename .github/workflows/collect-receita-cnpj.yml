name: Coletar cadastro CNPJ da Receita

# ADR 0093: preserva razão social, nome fantasia, natureza jurídica e situação
# dos CNPJs que aparecem em contratos e licitações de Barreiras. A base inteira
# (~7 GB) é baixada arquivo por arquivo, com SHA-256, e descartada.
# O compartilhamento da Receita fecha a conexão dos servidores do GitHub (fora
# do Brasil, 30/09/2026): a rotina agendada roda localmente
# (scripts/install-receita-cnpj-schedule.ps1); aqui fica só o disparo manual.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-receita-cnpj
  cancel-in-progress: false

jobs:
  collect:
    name: Preservar cadastro dos fornecedores
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: workers/collectors/src
      PERSISTENCE_MODE: postgres-supabase
      DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
      SUPABASE_URL: ${{ vars.QUERIDO_DIARIO_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.QUERIDO_DIARIO_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_WORKLOAD_EMAIL: ${{ secrets.MUNICIPAL_TRANSPARENCY_SUPABASE_WORKLOAD_EMAIL }}
      SUPABASE_WORKLOAD_PASSWORD: ${{ secrets.MUNICIPAL_TRANSPARENCY_SUPABASE_WORKLOAD_PASSWORD }}
      SUPABASE_RAW_ARTIFACTS_BUCKET: raw-artifacts
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências fixadas
        run: python -B scripts/install_collector_dependencies.py

      - name: Verificar CA oficial do Supabase
        run: >-
          echo "700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7  config/certificates/supabase-prod-ca-2021.crt"
          | sha256sum --check --strict

      - name: Preservar cadastro CNPJ dos contratados
        run: python -B -m barreiras_collectors.commands.collect_receita_cnpj
