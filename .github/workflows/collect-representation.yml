name: Coletar representação política

on:
  schedule:
    # Semanal: o quadro de parlamentares muda pouco entre sessões.
    - cron: "27 10 * * 2"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: collect-representation-production
  cancel-in-progress: false

jobs:
  collect-profiles:
    name: Preservar ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Uma fonte indisponível não cancela fontes independentes.
      fail-fast: false
      # A role de coleta admite duas conexões: uma fica disponível ao job TSE.
      max-parallel: 1
      matrix:
        include:
          - source: federal
            label: deputados federais da Bahia
            module: barreiras_collectors.commands.collect_camara_deputies
          - source: municipal
            label: vereadores de Barreiras
            module: barreiras_collectors.commands.collect_vereadores
          - source: state
            label: deputados estaduais da Bahia
            module: barreiras_collectors.commands.collect_alba_deputies
          - source: executive
            label: prefeito, vice e secretarias de Barreiras
            module: barreiras_collectors.commands.collect_municipal_executive
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: workers/collectors/src
      PERSISTENCE_MODE: postgres-supabase
      DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
      SUPABASE_URL: ${{ vars.QUERIDO_DIARIO_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.QUERIDO_DIARIO_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_WORKLOAD_EMAIL: ${{ secrets.QUERIDO_DIARIO_SUPABASE_WORKLOAD_EMAIL }}
      SUPABASE_WORKLOAD_PASSWORD: ${{ secrets.QUERIDO_DIARIO_SUPABASE_WORKLOAD_PASSWORD }}
      SUPABASE_RAW_ARTIFACTS_BUCKET: raw-artifacts
      COLLECTOR_MODULE: ${{ matrix.module }}

    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências fixadas
        run: python -m pip install --disable-pip-version-check ".[postgres,storage]"

      - name: Verificar CA oficial do Supabase
        run: >-
          echo "700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7  config/certificates/supabase-prod-ca-2021.crt"
          | sha256sum --check --strict

      - name: Executar coletor isolado
        shell: bash
        run: python -B -m "$COLLECTOR_MODULE"

  collect-elections:
    name: Preservar votação recebida em Barreiras
    runs-on: ubuntu-latest
    # O arquivo do TSE é grande; esta fonte não deve dividir o runner com as demais.
    timeout-minutes: 30
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: workers/collectors/src
      PERSISTENCE_MODE: postgres-supabase
      DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
      SUPABASE_URL: ${{ vars.QUERIDO_DIARIO_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.QUERIDO_DIARIO_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_WORKLOAD_EMAIL: ${{ secrets.QUERIDO_DIARIO_SUPABASE_WORKLOAD_EMAIL }}
      SUPABASE_WORKLOAD_PASSWORD: ${{ secrets.QUERIDO_DIARIO_SUPABASE_WORKLOAD_PASSWORD }}
      SUPABASE_RAW_ARTIFACTS_BUCKET: raw-artifacts

    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências fixadas
        run: python -m pip install --disable-pip-version-check ".[postgres,storage]"

      - name: Verificar CA oficial do Supabase
        run: >-
          echo "700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7  config/certificates/supabase-prod-ca-2021.crt"
          | sha256sum --check --strict

      - name: Preservar votação por eleição, cargo e turno
        run: python -B -m barreiras_collectors.commands.collect_tse_votes

  private-identities:
    name: Registrar identidades privadas oficiais
    # O importador depende apenas do acervo eleitoral, não das APIs parlamentares.
    needs: collect-elections
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Verificar configuração privada sem revelar segredos
        id: identity_secrets
        shell: bash
        env:
          IDENTITY_DATABASE_URL: ${{ secrets.IDENTITY_DATABASE_URL }}
          IDENTITY_AES_KEY_B64: ${{ secrets.IDENTITY_AES_KEY_B64 }}
          IDENTITY_HMAC_KEY_B64: ${{ secrets.IDENTITY_HMAC_KEY_B64 }}
          IDENTITY_KEY_VERSION: ${{ secrets.IDENTITY_KEY_VERSION }}
        run: |
          configured=true
          for value in \
            "$IDENTITY_DATABASE_URL" \
            "$IDENTITY_AES_KEY_B64" \
            "$IDENTITY_HMAC_KEY_B64" \
            "$IDENTITY_KEY_VERSION"
          do
            if [ -z "$value" ]; then
              configured=false
            fi
          done
          echo "configured=$configured" >> "$GITHUB_OUTPUT"

      - name: Informar importador ainda não ativado
        if: steps.identity_secrets.outputs.configured != 'true'
        run: >-
          echo "Importador privado não executado: credenciais exclusivas ainda não configuradas."

      - name: Baixar código
        if: steps.identity_secrets.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        if: steps.identity_secrets.outputs.configured == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências privadas fixadas
        if: steps.identity_secrets.outputs.configured == 'true'
        run: python -m pip install --disable-pip-version-check ".[postgres]"

      - name: Verificar CA oficial do Supabase
        if: steps.identity_secrets.outputs.configured == 'true'
        run: >-
          echo "700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7  config/certificates/supabase-prod-ca-2021.crt"
          | sha256sum --check --strict

      - name: Importar recorte oficial cifrado
        if: steps.identity_secrets.outputs.configured == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: workers/reconciliation/src
          IDENTITY_DATABASE_URL: ${{ secrets.IDENTITY_DATABASE_URL }}
          IDENTITY_AES_KEY_B64: ${{ secrets.IDENTITY_AES_KEY_B64 }}
          IDENTITY_HMAC_KEY_B64: ${{ secrets.IDENTITY_HMAC_KEY_B64 }}
          IDENTITY_KEY_VERSION: ${{ secrets.IDENTITY_KEY_VERSION }}
        run: >-
          python -B -m barreiras_reconciliation.commands.import_tse_identities
          --year 2022
          --year 2024

  summarize:
    name: Consolidar saúde da representação
    needs:
      - collect-profiles
      - collect-elections
      - private-identities
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      PROFILES_RESULT: ${{ needs.collect-profiles.result }}
      ELECTIONS_RESULT: ${{ needs.collect-elections.result }}
      IDENTITIES_RESULT: ${{ needs.private-identities.result }}
    steps:
      - name: Exibir resultado sem ocultar falhas
        shell: bash
        run: |
          printf 'perfis=%s\neleicoes=%s\nidentidades=%s\n' \
            "$PROFILES_RESULT" \
            "$ELECTIONS_RESULT" \
            "$IDENTITIES_RESULT"
          if [ "$PROFILES_RESULT" != "success" ] || \
             [ "$ELECTIONS_RESULT" != "success" ] || \
             [ "$IDENTITIES_RESULT" != "success" ]; then
            echo "Uma ou mais fontes de representação falharam; consulte o job isolado correspondente."
            exit 1
          fi
