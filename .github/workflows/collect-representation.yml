name: Coletar representação política

on:
  schedule:
    # Semanal: o quadro de parlamentares muda pouco entre sessões.
    - cron: "27 10 * * 2"
  workflow_dispatch:
    inputs:
      source:
        description: Fonte a coletar; use all para a rotina completa
        required: true
        default: all
        type: choice
        options:
          - all
          - federal
          - municipal
          - state
          - executive
          - elections

permissions:
  contents: read

concurrency:
  group: collect-representation-production
  cancel-in-progress: false

jobs:
  plan:
    name: Planejar fontes selecionadas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      profile_matrix: ${{ steps.plan.outputs.profile_matrix }}
      profile_count: ${{ steps.plan.outputs.profile_count }}
      collect_profiles: ${{ steps.plan.outputs.collect_profiles }}
      collect_elections: ${{ steps.plan.outputs.collect_elections }}
      collect_private_identities: ${{ steps.plan.outputs.collect_private_identities }}
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolver plano sem executar fontes não selecionadas
        id: plan
        shell: bash
        env:
          REQUESTED_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.source || 'all' }}
        run: |
          set -euo pipefail
          PLAN_JSON="$(node .github/scripts/resolve-representation-plan.mjs "$REQUESTED_SOURCE")"
          PROFILE_COUNT="$(printf '%s' "$PLAN_JSON" | jq -r '.profiles | length')"
          echo "profile_matrix=$(printf '%s' "$PLAN_JSON" | jq -c '.profiles')" >> "$GITHUB_OUTPUT"
          echo "profile_count=$PROFILE_COUNT" >> "$GITHUB_OUTPUT"
          echo "collect_profiles=$([ "$PROFILE_COUNT" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "collect_elections=$(printf '%s' "$PLAN_JSON" | jq -r '.collectElections')" >> "$GITHUB_OUTPUT"
          echo "collect_private_identities=$(printf '%s' "$PLAN_JSON" | jq -r '.collectPrivateIdentities')" >> "$GITHUB_OUTPUT"

  collect-profiles:
    name: Preservar ${{ matrix.label }}
    needs: plan
    if: needs.plan.outputs.collect_profiles == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Uma fonte indisponível não cancela fontes independentes.
      fail-fast: false
      # A role de coleta admite duas conexões: uma fica disponível ao job TSE.
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.profile_matrix) }}
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: workers/collectors/src
      PERSISTENCE_MODE: postgres-supabase
      DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
      SUPABASE_URL: ${{ vars.QUERIDO_DIARIO_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.QUERIDO_DIARIO_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_WORKLOAD_EMAIL: ${{ secrets.QUERIDO_DIARIO_SUPABASE_WORKLOAD_EMAIL }}
      SUPABASE_WORKLOAD_PASSWORD: ${{ secrets.QUERIDO_DIARIO_SUPABASE_WORKLOAD_PASSWORD }}
      SUPABASE_RAW_ARTIFACTS_BUCKET: raw-artifacts
      COLLECTOR_MODULE: ${{ matrix.module }}

    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências fixadas
        run: python -m pip install --disable-pip-version-check ".[postgres,storage]"

      - name: Verificar CA oficial do Supabase
        run: >-
          echo "700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7  config/certificates/supabase-prod-ca-2021.crt"
          | sha256sum --check --strict

      - name: Executar coletor isolado
        shell: bash
        run: python -B -m "$COLLECTOR_MODULE"

  collect-elections:
    name: Preservar votação recebida em Barreiras
    needs: plan
    if: needs.plan.outputs.collect_elections == 'true'
    runs-on: ubuntu-latest
    # O arquivo do TSE é grande; esta fonte não deve dividir o runner com as demais.
    timeout-minutes: 30
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: workers/collectors/src
      PERSISTENCE_MODE: postgres-supabase
      DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
      SUPABASE_URL: ${{ vars.QUERIDO_DIARIO_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.QUERIDO_DIARIO_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_WORKLOAD_EMAIL: ${{ secrets.QUERIDO_DIARIO_SUPABASE_WORKLOAD_EMAIL }}
      SUPABASE_WORKLOAD_PASSWORD: ${{ secrets.QUERIDO_DIARIO_SUPABASE_WORKLOAD_PASSWORD }}
      SUPABASE_RAW_ARTIFACTS_BUCKET: raw-artifacts

    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências fixadas
        run: python -m pip install --disable-pip-version-check ".[postgres,storage]"

      - name: Verificar CA oficial do Supabase
        run: >-
          echo "700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7  config/certificates/supabase-prod-ca-2021.crt"
          | sha256sum --check --strict

      - name: Preservar votação por eleição, cargo e turno
        run: python -B -m barreiras_collectors.commands.collect_tse_votes

  private-identities:
    name: Registrar identidades privadas oficiais
    # O importador depende apenas do acervo eleitoral, não das APIs parlamentares.
    needs: collect-elections
    if: needs.collect-elections.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Verificar configuração privada sem revelar segredos
        id: identity_secrets
        shell: bash
        env:
          IDENTITY_DATABASE_URL: ${{ secrets.IDENTITY_DATABASE_URL }}
          IDENTITY_AES_KEY_B64: ${{ secrets.IDENTITY_AES_KEY_B64 }}
          IDENTITY_HMAC_KEY_B64: ${{ secrets.IDENTITY_HMAC_KEY_B64 }}
          IDENTITY_KEY_VERSION: ${{ secrets.IDENTITY_KEY_VERSION }}
        run: |
          configured=true
          for value in \
            "$IDENTITY_DATABASE_URL" \
            "$IDENTITY_AES_KEY_B64" \
            "$IDENTITY_HMAC_KEY_B64" \
            "$IDENTITY_KEY_VERSION"
          do
            if [ -z "$value" ]; then
              configured=false
            fi
          done
          echo "configured=$configured" >> "$GITHUB_OUTPUT"

      - name: Informar importador ainda não ativado
        if: steps.identity_secrets.outputs.configured != 'true'
        run: >-
          echo "Importador privado não executado: credenciais exclusivas ainda não configuradas."

      - name: Baixar código
        if: steps.identity_secrets.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        if: steps.identity_secrets.outputs.configured == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências privadas fixadas
        if: steps.identity_secrets.outputs.configured == 'true'
        run: python -m pip install --disable-pip-version-check ".[postgres]"

      - name: Verificar CA oficial do Supabase
        if: steps.identity_secrets.outputs.configured == 'true'
        run: >-
          echo "700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7  config/certificates/supabase-prod-ca-2021.crt"
          | sha256sum --check --strict

      - name: Importar recorte oficial cifrado
        if: steps.identity_secrets.outputs.configured == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: workers/reconciliation/src
          IDENTITY_DATABASE_URL: ${{ secrets.IDENTITY_DATABASE_URL }}
          IDENTITY_AES_KEY_B64: ${{ secrets.IDENTITY_AES_KEY_B64 }}
          IDENTITY_HMAC_KEY_B64: ${{ secrets.IDENTITY_HMAC_KEY_B64 }}
          IDENTITY_KEY_VERSION: ${{ secrets.IDENTITY_KEY_VERSION }}
        run: >-
          python -B -m barreiras_reconciliation.commands.import_tse_identities
          --year 2022
          --year 2024

  summarize:
    name: Consolidar saúde da representação
    needs:
      - plan
      - collect-profiles
      - collect-elections
      - private-identities
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      PROFILES_RESULT: ${{ needs.collect-profiles.result }}
      ELECTIONS_RESULT: ${{ needs.collect-elections.result }}
      IDENTITIES_RESULT: ${{ needs.private-identities.result }}
      PROFILES_REQUIRED: ${{ needs.plan.outputs.collect_profiles }}
      ELECTIONS_REQUIRED: ${{ needs.plan.outputs.collect_elections }}
      IDENTITIES_REQUIRED: ${{ needs.plan.outputs.collect_private_identities }}
    steps:
      - name: Exibir resultado sem ocultar falhas
        shell: bash
        run: |
          set -euo pipefail
          failed=false

          verify_result() {
            local label="$1"
            local required="$2"
            local actual="$3"
            local expected="skipped"
            if [ "$required" = "true" ]; then
              expected="success"
            fi
            printf '%s=%s esperado=%s\n' "$label" "$actual" "$expected"
            if [ "$actual" != "$expected" ]; then
              failed=true
            fi
          }

          verify_result perfis "$PROFILES_REQUIRED" "$PROFILES_RESULT"
          verify_result eleicoes "$ELECTIONS_REQUIRED" "$ELECTIONS_RESULT"
          verify_result identidades "$IDENTITIES_REQUIRED" "$IDENTITIES_RESULT"
          echo "Jobs não selecionados: esperado=skipped."

          if [ "$failed" = "true" ]; then
            echo "Uma ou mais fontes de representação falharam; consulte o job isolado correspondente."
            exit 1
          fi
