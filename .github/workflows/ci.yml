name: Verificações

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node, contratos e aplicações web
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    # O painel exige as variáveis públicas durante o prerender. O CI usa
    # placeholders sem acesso a dados; Vercel injeta os valores reais.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.x

      - name: Preparar pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Validar contratos e fontes
        run: |
          pnpm run check:contracts
          pnpm run check:sources
          pnpm run check:source-catalog

      - name: Testar migrations e seed
        run: pnpm run check:migration

      - name: Testar Node
        run: pnpm test

      - name: Verificar tipos
        run: |
          pnpm --filter @barreiras-em-dados/web typecheck
          pnpm --filter @barreiras-em-dados/admin typecheck

      - name: Construir aplicações
        run: |
          pnpm --filter @barreiras-em-dados/web build
          pnpm --filter @barreiras-em-dados/admin build

  python:
    name: Coletores e processamento de documentos
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências fixadas
        run: python -m pip install --disable-pip-version-check '.[dev,postgres,storage,pdf,ocr]'

      - name: Instalar Tesseract em português
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-por

      - name: Verificar estilo
        run: >-
          python -m ruff check workers/collectors/src
          workers/document-processing/src workers/normalization/src
          workers/reconciliation/src tests

      - name: Testar coletores e processamento de documentos
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: workers/collectors/src:workers/document-processing/src:workers/normalization/src:workers/reconciliation/src
        run: python -B -m unittest discover -s tests -t . -p 'test_*.py' -v

  public_availability:
    name: Sondar rotas públicas críticas
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências mínimas
        run: python -m pip install --disable-pip-version-check '.[postgres]'

      - name: Sondar e registrar disponibilidade pública
        env:
          APP_ENV: production
          PERSISTENCE_MODE: postgres-supabase
          DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
          PUBLIC_SITE_BASE_URL: https://barreiras-em-dados.vercel.app
          WORKFLOW_EVENT: ${{ github.event_name }}
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: workers/collectors/src
        run: >-
          python -B -m
          barreiras_collectors.commands.probe_public_availability
          --execution-origin github_actions
          --workflow-event "$WORKFLOW_EVENT"
