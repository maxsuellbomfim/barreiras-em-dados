name: Publicar dados financeiros validados

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      fiscal_year_from:
        description: "Primeiro ano do backfill"
        required: false
        default: "2021"
        type: string
      fiscal_year_to:
        description: "Último ano do backfill"
        required: false
        default: ""
        type: string
      reference_month:
        description: "Mês exato dos restos a pagar (1 a 12; vazio percorre o ano)"
        required: false
        default: ""
        type: string
      payroll_reference_month:
        description: "Competência exata da folha (AAAA-MM; vazio percorre o período)"
        required: false
        default: ""
        type: string
      limit:
        description: "Máximo de PDFs por execução"
        required: false
        default: "5"
        type: choice
        options:
          - "1"
          - "5"
          - "10"
          - "20"
      publication_scope:
        description: "Publicadores executados neste lote"
        required: false
        default: "all"
        type: choice
        options:
          - "all"
          - "expenses"
          - "public-obligations"
          - "payroll"
      dry_run_public_obligations:
        description: "Validar restos a pagar sem gravar no banco"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: municipal-finance-publication-production
  cancel-in-progress: false

jobs:
  publish:
    name: Publicar totais financeiros determinísticos
    runs-on: ubuntu-latest
    # PDFs grandes são extraídos sequencialmente e podem levar vários minutos.
    # A publicação é idempotente; o timeout maior permite concluir o lote sem
    # descartar o progresso já confirmado.
    timeout-minutes: 120
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: workers/collectors/src:workers/document-processing/src:workers/normalization/src
      PERSISTENCE_MODE: postgres-supabase
      DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
      SUPABASE_URL: ${{ vars.QUERIDO_DIARIO_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.QUERIDO_DIARIO_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_WORKLOAD_EMAIL: ${{ secrets.MUNICIPAL_TRANSPARENCY_SUPABASE_WORKLOAD_EMAIL }}
      SUPABASE_WORKLOAD_PASSWORD: ${{ secrets.MUNICIPAL_TRANSPARENCY_SUPABASE_WORKLOAD_PASSWORD }}
      SUPABASE_RAW_ARTIFACTS_BUCKET: raw-artifacts
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências fixadas
        run: python -m pip install --disable-pip-version-check ".[postgres,storage,pdf,ocr]"

      - name: Instalar OCR em português
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends tesseract-ocr tesseract-ocr-por

      - name: Verificar CA oficial do Supabase
        run: >-
          echo "700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7  config/certificates/supabase-prod-ca-2021.crt"
          | sha256sum --check --strict

      - name: Publicar janela de despesas
        if: >-
          inputs.dry_run_public_obligations != true
          && inputs.publication_scope != 'public-obligations'
          && inputs.publication_scope != 'payroll'
        shell: bash
        env:
          INPUT_FISCAL_YEAR_FROM: ${{ inputs.fiscal_year_from }}
          INPUT_FISCAL_YEAR_TO: ${{ inputs.fiscal_year_to }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_PUBLICATION_SCOPE: ${{ inputs.publication_scope }}
        run: |
          year_from="${INPUT_FISCAL_YEAR_FROM:-2021}"
          year_to="${INPUT_FISCAL_YEAR_TO:-$(date +%Y)}"
          # Cinco PDFs permitem avançar o replay das unidades sem transformar
          # esta rotina diária em uma carga irrestrita.
          limit="${INPUT_LIMIT:-5}"
          extra_args=()
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" \
            && "${INPUT_PUBLICATION_SCOPE:-all}" == "expenses" ]]; then
            extra_args+=(--require-artifact)
          fi
          python -B -m barreiras_normalization.commands.publish_expense_reports \
            --limit "$limit" \
            --fiscal-year-from "$year_from" \
            --fiscal-year-to "$year_to" \
            "${extra_args[@]}"

      - name: Publicar pagamentos de restos a pagar dos balancetes
        if: >-
          inputs.publication_scope != 'expenses'
          && inputs.publication_scope != 'payroll'
        shell: bash
        env:
          INPUT_FISCAL_YEAR_FROM: ${{ inputs.fiscal_year_from }}
          INPUT_FISCAL_YEAR_TO: ${{ inputs.fiscal_year_to }}
          INPUT_REFERENCE_MONTH: ${{ inputs.reference_month }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_DRY_RUN: ${{ inputs.dry_run_public_obligations }}
        run: |
          year_from="${INPUT_FISCAL_YEAR_FROM:-2021}"
          year_to="${INPUT_FISCAL_YEAR_TO:-$(date +%Y)}"
          limit="${INPUT_LIMIT:-1}"
          extra_args=()
          if [[ "${INPUT_DRY_RUN:-false}" == "true" ]]; then
            extra_args+=(--dry-run)
          fi
          if [[ -n "${INPUT_REFERENCE_MONTH:-}" ]]; then
            extra_args+=(--reference-month "$INPUT_REFERENCE_MONTH")
          fi
          python -B -m barreiras_normalization.commands.publish_public_obligations \
            --limit "$limit" \
            --fiscal-year-from "$year_from" \
            --fiscal-year-to "$year_to" \
            "${extra_args[@]}"

      - name: Publicar totais mensais validados da folha
        if: >-
          inputs.dry_run_public_obligations != true
          && inputs.publication_scope != 'expenses'
          && inputs.publication_scope != 'public-obligations'
        shell: bash
        env:
          INPUT_FISCAL_YEAR_FROM: ${{ inputs.fiscal_year_from }}
          INPUT_FISCAL_YEAR_TO: ${{ inputs.fiscal_year_to }}
          INPUT_PAYROLL_REFERENCE_MONTH: ${{ inputs.payroll_reference_month }}
          INPUT_LIMIT: ${{ inputs.limit }}
        run: |
          year_from="${INPUT_FISCAL_YEAR_FROM:-2021}"
          year_to="${INPUT_FISCAL_YEAR_TO:-$(date +%Y)}"
          limit="${INPUT_LIMIT:-1}"
          extra_args=()
          if [[ -n "${INPUT_PAYROLL_REFERENCE_MONTH:-}" ]]; then
            extra_args+=(--reference-month "$INPUT_PAYROLL_REFERENCE_MONTH")
          fi
          python -B -m barreiras_normalization.commands.publish_payroll_reports \
            --limit "$limit" \
            --fiscal-year-from "$year_from" \
            --fiscal-year-to "$year_to" \
            "${extra_args[@]}"

      - name: Publicar folha agregada por regime ou vínculo
        if: >-
          inputs.dry_run_public_obligations != true
          && inputs.publication_scope != 'expenses'
          && inputs.publication_scope != 'public-obligations'
        shell: bash
        env:
          INPUT_PAYROLL_REFERENCE_MONTH: ${{ inputs.payroll_reference_month }}
        run: |
          extra_args=()
          if [[ -n "${INPUT_PAYROLL_REFERENCE_MONTH:-}" ]]; then
            extra_args+=(--reference-month "$INPUT_PAYROLL_REFERENCE_MONTH")
            extra_args+=(--require-complete-month)
          fi
          python -B -m \
            barreiras_normalization.commands.publish_payroll_regime_breakdowns \
            --limit 20 \
            "${extra_args[@]}"

      - name: Publicar faixas agregadas de provento bruto
        if: >-
          inputs.dry_run_public_obligations != true
          && (inputs.publication_scope == 'all'
          || inputs.publication_scope == 'payroll')
        shell: bash
        env:
          INPUT_PAYROLL_REFERENCE_MONTH: ${{ inputs.payroll_reference_month }}
        run: |
          extra_args=()
          if [[ -n "${INPUT_PAYROLL_REFERENCE_MONTH:-}" ]]; then
            extra_args+=(--reference-month "$INPUT_PAYROLL_REFERENCE_MONTH")
            extra_args+=(--require-complete-month)
          fi
          python -B -m \
            barreiras_normalization.commands.publish_payroll_compensation_distributions \
            --limit 20 \
            "${extra_args[@]}"
