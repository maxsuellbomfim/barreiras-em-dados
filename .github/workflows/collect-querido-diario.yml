name: Coletar Querido Diário

on:
  schedule:
    # Coleta diária da véspera.
    - cron: "17 11 * * *"
    # Backfill retroativo: uma janela curta por execução, até o horizonte.
    - cron: "17 2,8,14,20 * * *"
  workflow_dispatch:
    inputs:
      since:
        description: Data inicial em YYYY-MM-DD; deixe ambas vazias para ontem
        required: false
        type: string
      until:
        description: Data final em YYYY-MM-DD; janela máxima de sete dias
        required: false
        type: string
      integral_limit:
        description: Máximo de edições integrais processadas nesta execução
        required: false
        default: "300"
        type: string
      integral_edition:
        description: EdiÃ§Ã£o especÃ­fica para replay integral (opcional)
        required: false
        type: string
      integral_year:
        description: Ano da ediÃ§Ã£o especÃ­fica para replay integral (opcional)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: collect-querido-diario-production
  cancel-in-progress: false

jobs:
  collect:
    name: Preservar bruto e registrar metadados
    runs-on: ubuntu-latest
    # O teto limita o processamento integral por execução e permite retomada
    # idempotente sem deixar uma coleta travada consumir o runner.
    timeout-minutes: 35
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: workers/collectors/src
      PERSISTENCE_MODE: postgres-supabase
      DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
      SUPABASE_URL: ${{ vars.QUERIDO_DIARIO_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.QUERIDO_DIARIO_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_WORKLOAD_EMAIL: ${{ secrets.QUERIDO_DIARIO_SUPABASE_WORKLOAD_EMAIL }}
      SUPABASE_WORKLOAD_PASSWORD: ${{ secrets.QUERIDO_DIARIO_SUPABASE_WORKLOAD_PASSWORD }}
      SUPABASE_RAW_ARTIFACTS_BUCKET: raw-artifacts
      QUERIDO_DIARIO_TERRITORY_ID: "2903201"
      QUERIDO_DIARIO_REQUESTS_PER_MINUTE: "30"
      # O limite anterior de 32 MiB travava em edições grandes. PDFs oficiais
      # escaneados podem exceder 64 MiB; o Storage os particiona
      # em uploads menores, preservando o hash do objeto inteiro.
      QUERIDO_DIARIO_MAX_DOCUMENT_BYTES: "268435456"
      QUERIDO_DIARIO_MAX_DOCUMENTS_PER_RUN: "40"
      QUERIDO_DIARIO_BACKFILL_HORIZON: "2021-01-01"
      HTTP_CONNECT_TIMEOUT_SECONDS: "5"
      HTTP_READ_TIMEOUT_SECONDS: "30"
      HTTP_MAX_ATTEMPTS: "5"
      INTEGRAL_LIMIT: ${{ inputs.integral_limit || '6' }}

    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências fixadas
        run: python -m pip install --disable-pip-version-check ".[postgres,storage,pdf,ocr]"

      - name: Instalar Tesseract em português
        run: >-
          sudo apt-get update -q
          && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-por
          && tesseract --version | head -1

      - name: Verificar CA oficial do Supabase
        run: >-
          echo "700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7  config/certificates/supabase-prod-ca-2021.crt"
          | sha256sum --check --strict

      - name: Resolver janela da coleta
        id: window
        env:
          REQUESTED_SINCE: ${{ inputs.since }}
          REQUESTED_UNTIL: ${{ inputs.until }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          if [ -n "${SCHEDULE_EXPRESSION}" ] \
            && [ "${SCHEDULE_EXPRESSION}" != "17 11 * * *" ]; then
            python -B -m barreiras_collectors.commands.resolve_backfill_window
          else
            python -B -m \
              barreiras_collectors.commands.resolve_collection_window \
              --since "${REQUESTED_SINCE}" \
              --until "${REQUESTED_UNTIL}"
          fi

      - name: Coletar e preservar
        id: querido_diario
        # A API complementar pode ficar indisponível sem bloquear as fontes
        # oficiais. A falha permanece como aviso e na DLQ, sem produzir um X
        # que pareça uma falha da coleta oficial.
        if: steps.window.outputs.skip != 'true'
        env:
          COLLECTION_SINCE: ${{ steps.window.outputs.since }}
          COLLECTION_UNTIL: ${{ steps.window.outputs.until }}
        run: |
          set +e
          python -B -m \
            barreiras_collectors.commands.collect_querido_diario \
            --since "${COLLECTION_SINCE}" \
            --until "${COLLECTION_UNTIL}" \
            --page-size 100
          api_exit_code=$?
          set -e
          if [ "${api_exit_code}" -eq 0 ]; then
            echo "availability=available" >> "${GITHUB_OUTPUT}"
          else
            echo "availability=unavailable" >> "${GITHUB_OUTPUT}"
            echo "::warning title=API complementar indisponível::O Querido Diário falhou com código ${api_exit_code}; as fontes oficiais continuam e a ocorrência será preservada na DLQ."
          fi

      - name: Preservar catálogo oficial do Diário
        id: official_catalog
        # A fonte primária cobre também o backfill. A API do Querido Diário é
        # complementar e nunca pode impedir a descoberta oficial por período.
        continue-on-error: true
        if: steps.window.outputs.skip != 'true'
        env:
          COLLECTION_MODE: ${{ steps.window.outputs.mode }}
          COLLECTION_SINCE: ${{ steps.window.outputs.since }}
          COLLECTION_UNTIL: ${{ steps.window.outputs.until }}
        run: |
          if [ "${COLLECTION_MODE}" = "backfill" ]; then
            python -B -m \
              barreiras_collectors.commands.collect_official_diary_catalog \
              --since "${COLLECTION_SINCE}" \
              --until "${COLLECTION_UNTIL}"
          else
            python -B -m \
              barreiras_collectors.commands.collect_official_diary_catalog
          fi

      - name: Coletar edições diretas do Diário
        id: direct_diary
        # Uma falha desta trilha não impede processar artefatos já preservados;
        # o gate final mantém a falha oficial visível.
        continue-on-error: true
        # O catálogo fornece os números existentes; a sonda direta completa a
        # descoberta sem presumir que todas as numerações sejam contíguas.
        # O backfill não deve repetir essas chamadas várias vezes por dia.
        if: steps.window.outputs.skip != 'true'
        run: >-
          python -B -m barreiras_collectors.commands.collect_direct_diary

      - name: Preparar texto e candidatos determinísticos
        # PDFs com texto são concluídos aqui; PDFs escaneados registram as
        # páginas pendentes para o OCR logo abaixo, ainda nesta execução.
        if: steps.window.outputs.skip != 'true'
        env:
          PYTHONPATH: workers/collectors/src:workers/document-processing/src
        run: >-
          python -B -m barreiras_docproc.commands.process_gazette_acts
          --limit 30

      - name: OCR das páginas escaneadas
        if: steps.window.outputs.skip != 'true'
        env:
          PYTHONPATH: workers/collectors/src:workers/document-processing/src
        run: >-
          python -B -m barreiras_docproc.commands.ocr_gazette_pages
          --limit-pages 30

      - name: Extrair candidatos determinísticos após OCR
        id: extract
        if: steps.window.outputs.skip != 'true'
        env:
          PYTHONPATH: workers/collectors/src:workers/document-processing/src
        run: >-
          python -B -m barreiras_docproc.commands.process_gazette_acts
          --limit 30

      - name: Sugerir campos e resumos com IA assistida
        if: steps.window.outputs.mode != 'backfill'
        # Defesa em profundidade: o comando já degrada sozinho, mas um
        # provedor instável nunca pode derrubar a coleta nem a publicação.
        continue-on-error: true
        env:
          PYTHONPATH: workers/collectors/src:workers/document-processing/src
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: >-
          python -B -m barreiras_docproc.commands.assist_extraction_candidates
          --limit 25

      - name: Publicar candidatos verificados por código (ADR 0012)
        if: steps.window.outputs.skip != 'true'
        env:
          PYTHONPATH: workers/collectors/src:workers/document-processing/src
        run: >-
          python -B -m barreiras_docproc.commands.publish_verified_candidates
          --limit 20

      - name: Organizar edições em documentos integrais
        if: steps.window.outputs.skip != 'true'
        env:
          PYTHONPATH: workers/collectors/src:workers/document-processing/src
          INTEGRAL_LIMIT: ${{ inputs.integral_limit || '300' }}
          INTEGRAL_EDITION: ${{ inputs.integral_edition }}
          INTEGRAL_YEAR: ${{ inputs.integral_year }}
        run: |
          if [ -n "${INTEGRAL_EDITION}" ] || [ -n "${INTEGRAL_YEAR}" ]; then
            if [ -z "${INTEGRAL_EDITION}" ] || [ -z "${INTEGRAL_YEAR}" ]; then
              echo "integral_edition e integral_year devem ser informados juntos."
              exit 2
            fi
            python -B -m barreiras_docproc.commands.segment_gazette_editions \
              --limit "${INTEGRAL_LIMIT}" \
              --edition "${INTEGRAL_EDITION}" \
              --edition-year "${INTEGRAL_YEAR}"
          else
            python -B -m barreiras_docproc.commands.segment_gazette_editions \
              --limit "${INTEGRAL_LIMIT}"
          fi

      - name: Registrar indisponibilidade da API complementar
        if: >-
          always() &&
          steps.querido_diario.outputs.availability == 'unavailable'
        env:
          COLLECTION_SINCE: ${{ steps.window.outputs.since }}
          COLLECTION_UNTIL: ${{ steps.window.outputs.until }}
        run: >-
          python -B -m
          barreiras_collectors.commands.write_failure_record
          --destination artifacts/querido-diario-api-failure.json

      - name: Preservar DLQ da API complementar
        if: >-
          always() &&
          steps.querido_diario.outputs.availability == 'unavailable'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: querido-diario-api-dlq-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/querido-diario-api-failure.json
          if-no-files-found: error
          retention-days: 30

      - name: Sinalizar falha obrigatória das fontes
        if: >-
          always() &&
          steps.window.outputs.skip != 'true' &&
          (
            steps.official_catalog.outcome == 'failure' ||
            steps.direct_diary.outcome == 'failure'
          )
        run: |
          echo "Uma fonte oficial falhou; os artefatos disponíveis foram processados."
          exit 1

      - name: Registrar falha sanitizada
        if: failure()
        env:
          COLLECTION_SINCE: ${{ steps.window.outputs.since }}
          COLLECTION_UNTIL: ${{ steps.window.outputs.until }}
        run: >-
          python -B -m
          barreiras_collectors.commands.write_failure_record

      - name: Preservar DLQ para replay manual
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: querido-diario-dlq-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/collector-failure.json
          if-no-files-found: error
          retention-days: 30
