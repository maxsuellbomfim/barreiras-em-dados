name: Coletar Querido Diário

on:
  schedule:
    # Coleta diária da véspera.
    - cron: "17 11 * * *"
    # Backfill retroativo: uma janela curta por execução, até o horizonte.
    - cron: "17 2,8,14,20 * * *"
  workflow_dispatch:
    inputs:
      since:
        description: Data inicial em YYYY-MM-DD; deixe ambas vazias para ontem
        required: false
        type: string
      until:
        description: Data final em YYYY-MM-DD; janela máxima de sete dias
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: collect-querido-diario-production
  cancel-in-progress: false

jobs:
  collect:
    name: Preservar bruto e registrar metadados
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: workers/collectors/src
      PERSISTENCE_MODE: postgres-supabase
      DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
      SUPABASE_URL: ${{ vars.QUERIDO_DIARIO_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.QUERIDO_DIARIO_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_WORKLOAD_EMAIL: ${{ secrets.QUERIDO_DIARIO_SUPABASE_WORKLOAD_EMAIL }}
      SUPABASE_WORKLOAD_PASSWORD: ${{ secrets.QUERIDO_DIARIO_SUPABASE_WORKLOAD_PASSWORD }}
      SUPABASE_RAW_ARTIFACTS_BUCKET: raw-artifacts
      QUERIDO_DIARIO_TERRITORY_ID: "2903201"
      QUERIDO_DIARIO_REQUESTS_PER_MINUTE: "30"
      QUERIDO_DIARIO_MAX_DOCUMENT_BYTES: "33554432"
      QUERIDO_DIARIO_MAX_DOCUMENTS_PER_RUN: "40"
      QUERIDO_DIARIO_BACKFILL_HORIZON: "2021-01-01"
      HTTP_CONNECT_TIMEOUT_SECONDS: "5"
      HTTP_READ_TIMEOUT_SECONDS: "30"
      HTTP_MAX_ATTEMPTS: "5"

    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências fixadas
        run: python -m pip install --disable-pip-version-check ".[postgres,storage,pdf,ocr]"

      - name: Instalar Tesseract em português
        run: >-
          sudo apt-get update -q
          && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-por
          && tesseract --version | head -1

      - name: Verificar CA oficial do Supabase
        run: >-
          echo "700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7  config/certificates/supabase-prod-ca-2021.crt"
          | sha256sum --check --strict

      - name: Resolver janela da coleta
        id: window
        env:
          REQUESTED_SINCE: ${{ inputs.since }}
          REQUESTED_UNTIL: ${{ inputs.until }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          if [ -n "${SCHEDULE_EXPRESSION}" ] \
            && [ "${SCHEDULE_EXPRESSION}" != "17 11 * * *" ]; then
            python -B -m barreiras_collectors.commands.resolve_backfill_window
          else
            python -B -m \
              barreiras_collectors.commands.resolve_collection_window \
              --since "${REQUESTED_SINCE}" \
              --until "${REQUESTED_UNTIL}"
          fi

      - name: Coletar e preservar
        if: steps.window.outputs.skip != 'true'
        env:
          COLLECTION_SINCE: ${{ steps.window.outputs.since }}
          COLLECTION_UNTIL: ${{ steps.window.outputs.until }}
        run: >-
          python -B -m
          barreiras_collectors.commands.collect_querido_diario
          --since "${COLLECTION_SINCE}"
          --until "${COLLECTION_UNTIL}"
          --page-size 100

      - name: Coletar edições diretas do Diário
        run: >-
          python -B -m barreiras_collectors.commands.collect_direct_diary

      - name: OCR das páginas escaneadas
        env:
          PYTHONPATH: workers/collectors/src:workers/document-processing/src
        run: >-
          python -B -m barreiras_docproc.commands.ocr_gazette_pages
          --limit-pages 30

      - name: Extrair candidatos determinísticos
        id: extract
        env:
          PYTHONPATH: workers/collectors/src:workers/document-processing/src
        run: >-
          python -B -m barreiras_docproc.commands.process_gazette_acts
          --limit 20

      - name: Sugerir campos e resumos com IA assistida
        env:
          PYTHONPATH: workers/collectors/src:workers/document-processing/src
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: >-
          python -B -m barreiras_docproc.commands.assist_extraction_candidates
          --limit 10

      - name: Registrar falha sanitizada
        if: failure()
        env:
          COLLECTION_SINCE: ${{ steps.window.outputs.since }}
          COLLECTION_UNTIL: ${{ steps.window.outputs.until }}
        run: >-
          python -B -m
          barreiras_collectors.commands.write_failure_record

      - name: Preservar DLQ para replay manual
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: querido-diario-dlq-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/collector-failure.json
          if-no-files-found: error
          retention-days: 30
