name: Preservar empenhos municipais

# ADR 0086. Cada mês fechado de empenhos, liquidações e pagamentos vira uma partição
# do seu endpoint: a grade bruta do sistema WebRun vai para o Storage privado
# por SHA-256 e cada linha distinta vira um registro bruto. O mês anterior é recoletado duas vezes
# (dias 3 e 20); grade idêntica é idempotente e grade alterada cria nova
# versão sem apagar a anterior. Nada aqui publica valores.

on:
  schedule:
    - cron: "17 9 3,20 * *"
  workflow_dispatch:
    inputs:
      start_month:
        description: "Primeiro mês da janela (AAAA-MM); vazio = mês anterior"
        required: false
        default: ""
        type: string
      end_month:
        description: "Último mês da janela (AAAA-MM)"
        required: false
        default: ""
        type: string
      max_months:
        description: "Limite defensivo de meses no lote"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "3"
          - "6"
      stage:
        description: "Estágio da despesa"
        required: true
        default: "todos"
        type: choice
        options:
          - "todos"
          - "empenhos"
          - "liquidacoes"
          - "pagamentos"

permissions:
  contents: read

concurrency:
  group: municipal-commitments-collection-production
  cancel-in-progress: false

jobs:
  collect:
    name: Preservar grade mensal de empenhos
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: workers/collectors/src:workers/reconciliation/src
      PERSISTENCE_MODE: postgres-supabase
      DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
      SUPABASE_URL: ${{ vars.QUERIDO_DIARIO_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.QUERIDO_DIARIO_SUPABASE_PUBLISHABLE_KEY }}
      # Mesma identidade do corredor municipal-transparency/ no Storage.
      SUPABASE_WORKLOAD_EMAIL: ${{ secrets.MUNICIPAL_TRANSPARENCY_SUPABASE_WORKLOAD_EMAIL }}
      SUPABASE_WORKLOAD_PASSWORD: ${{ secrets.MUNICIPAL_TRANSPARENCY_SUPABASE_WORKLOAD_PASSWORD }}
      SUPABASE_RAW_ARTIFACTS_BUCKET: raw-artifacts
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências fixadas
        run: python -m pip install --disable-pip-version-check ".[postgres,storage]"

      - name: Verificar CA oficial do Supabase
        run: >-
          echo "700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7  config/certificates/supabase-prod-ca-2021.crt"
          | sha256sum --check --strict

      - name: Preservar meses fechados
        env:
          START_MONTH: ${{ inputs.start_month || '' }}
          END_MONTH: ${{ inputs.end_month || '' }}
          MAX_MONTHS: ${{ inputs.max_months || '1' }}
          STAGE: ${{ inputs.stage || 'todos' }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--max-months "$MAX_MONTHS" --stage "$STAGE")
          if [ -n "$START_MONTH" ] || [ -n "$END_MONTH" ]; then
            args+=(--start-month "$START_MONTH" --end-month "$END_MONTH")
          fi
          python -B -m barreiras_collectors.commands.collect_municipal_commitments "${args[@]}"

      # ADR 0086: decide a ligação empenho -> contrato só para empenhos ainda
      # sem decisão desta versão da regra; grava append-only e não publica.
      - name: Ligar empenhos a contratos pela regra determinística
        run: >-
          python -B -m barreiras_reconciliation.commands.link_commitments_to_contracts
          --max-commitments 50000
