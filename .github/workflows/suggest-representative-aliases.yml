name: Sugerir aliases de autoria legislativa

on:
  schedule:
    # Sugestões são baratas e ficam pendentes; nunca publicam sozinhas.
    - cron: "41 11 * * 3"
  workflow_dispatch:
    inputs:
      limit:
        description: "Máximo de nomes de autoria por execução"
        required: false
        default: "20"
        type: string

permissions:
  contents: read

concurrency:
  group: representative-alias-assist-production
  cancel-in-progress: false

jobs:
  suggest:
    name: Gerar sugestões pendentes de aliases
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: workers/collectors/src:workers/document-processing/src
      PERSISTENCE_MODE: postgres-supabase
      DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
      SUPABASE_URL: ${{ vars.QUERIDO_DIARIO_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.QUERIDO_DIARIO_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_WORKLOAD_EMAIL: ${{ secrets.QUERIDO_DIARIO_SUPABASE_WORKLOAD_EMAIL }}
      SUPABASE_WORKLOAD_PASSWORD: ${{ secrets.QUERIDO_DIARIO_SUPABASE_WORKLOAD_PASSWORD }}
      SUPABASE_RAW_ARTIFACTS_BUCKET: raw-artifacts
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências fixadas
        run: python -m pip install --disable-pip-version-check ".[postgres]"

      - name: Verificar CA oficial do Supabase
        run: >-
          echo "700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7
          config/certificates/supabase-prod-ca-2021.crt"
          | sha256sum --check --strict

      - name: Gerar sugestões assistidas (sem publicação automática)
        run: >-
          python -B -m barreiras_docproc.commands.suggest_representative_aliases
          --limit "${{ inputs.limit || '20' }}"
