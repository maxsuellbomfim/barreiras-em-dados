name: Publicar comentários mensais de finanças

on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:
    inputs:
      fiscal_year_from:
        description: "Primeiro ano do backfill"
        required: false
        default: "2021"
        type: string
      fiscal_year_to:
        description: "Último ano do backfill"
        required: false
        default: ""
        type: string
      limit:
        description: "Máximo de fechamentos por execução"
        required: false
        default: "12"
        type: choice
        options:
          - "1"
          - "5"
          - "12"
          - "24"

permissions:
  contents: read

concurrency:
  group: publish-monthly-finance-commentary-production
  cancel-in-progress: false

jobs:
  publish:
    name: Publicar comentários financeiros assistidos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: workers/collectors/src:workers/document-processing/src:workers/normalization/src
      PERSISTENCE_MODE: postgres-supabase
      DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências fixadas
        run: python -m pip install --disable-pip-version-check ".[postgres]"

      - name: Publicar comentários validados
        shell: bash
        env:
          INPUT_FISCAL_YEAR_FROM: ${{ inputs.fiscal_year_from }}
          INPUT_FISCAL_YEAR_TO: ${{ inputs.fiscal_year_to }}
          INPUT_LIMIT: ${{ inputs.limit }}
        run: |
          year_from="${INPUT_FISCAL_YEAR_FROM:-2021}"
          year_to="${INPUT_FISCAL_YEAR_TO:-$(date +%Y)}"
          limit="${INPUT_LIMIT:-12}"
          python -B -m barreiras_normalization.commands.publish_monthly_finance_commentary \
            --limit "$limit" \
            --fiscal-year-from "$year_from" \
            --fiscal-year-to "$year_to"
