name: Coletar documentos mensais do TCM-BA

on:

  workflow_dispatch:
    inputs:
      mode:
        description: "Operação segura a executar"
        required: true
        default: "collect"
        type: choice
        options:
          - "collect"
          - "process_existing"
          - "process_pages"
      competence:
        description: "Competência MM/AAAA; vazio escolhe a mais antiga incompleta"
        required: false
        default: ""
        type: string
      max_documents:
        description: "Máximo de PDFs nesta execução"
        required: false
        default: "5"
        type: choice
        options:
          - "1"
          - "5"

permissions:
  contents: read

concurrency:
  group: municipal-finance-collection-production
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'collect'
    name: Preservar e auditar lote documental do TCM-BA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: workers/collectors/src:workers/document-processing/src
      PERSISTENCE_MODE: postgres-supabase
      SUPABASE_RAW_ARTIFACTS_BUCKET: raw-artifacts
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências fixadas
        run: python -m pip install --disable-pip-version-check ".[postgres,storage,pdf,ocr]"

      - name: Instalar OCR em português
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-por

      - name: Verificar CA oficial do Supabase
        run: >-
          echo "700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7  config/certificates/supabase-prod-ca-2021.crt"
          | sha256sum --check --strict

      - name: Planejar competência mais antiga incompleta
        id: plan
        env:
          DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
          REQUESTED_COMPETENCE: ${{ github.event_name == 'workflow_dispatch' && inputs.competence || '' }}
        shell: bash
        run: |
          if [[ -n "$REQUESTED_COMPETENCE" ]]; then
            if [[ ! "$REQUESTED_COMPETENCE" =~ ^(0[1-9]|1[0-2])/[0-9]{4}$ ]]; then
              echo "Competência inválida; use MM/AAAA." >&2
              exit 1
            fi
            competence="$REQUESTED_COMPETENCE"
          else
            competence="$(python -B -m barreiras_collectors.commands.plan_tcm_ba_document_batch --year-from 2021)"
          fi
          echo "competence=$competence" >> "$GITHUB_OUTPUT"
          if [[ -z "$competence" ]]; then
            echo "Nenhuma competência documental elegível foi encontrada."
          else
            echo "Competência planejada: $competence"
          fi

      - name: Preservar lote documental
        if: steps.plan.outputs.competence != ''
        env:
          DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
          SUPABASE_URL: ${{ vars.QUERIDO_DIARIO_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.QUERIDO_DIARIO_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_WORKLOAD_EMAIL: ${{ secrets.MUNICIPAL_TRANSPARENCY_SUPABASE_WORKLOAD_EMAIL }}
          SUPABASE_WORKLOAD_PASSWORD: ${{ secrets.MUNICIPAL_TRANSPARENCY_SUPABASE_WORKLOAD_PASSWORD }}
          TCM_COMPETENCE: ${{ steps.plan.outputs.competence }}
          TCM_MAX_DOCUMENTS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_documents || '5' }}
        run: >-
          python -B -m
          barreiras_collectors.commands.collect_tcm_ba_documents
          --competence "$TCM_COMPETENCE"
          --max-documents "$TCM_MAX_DOCUMENTS"
          --requests-per-minute "30"

      - name: Auditar banco e objetos privados
        if: steps.plan.outputs.competence != ''
        env:
          DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
          SUPABASE_URL: ${{ vars.QUERIDO_DIARIO_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.QUERIDO_DIARIO_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_WORKLOAD_EMAIL: ${{ secrets.MUNICIPAL_TRANSPARENCY_SUPABASE_WORKLOAD_EMAIL }}
          SUPABASE_WORKLOAD_PASSWORD: ${{ secrets.MUNICIPAL_TRANSPARENCY_SUPABASE_WORKLOAD_PASSWORD }}
          TCM_COMPETENCE: ${{ steps.plan.outputs.competence }}
        run: >-
          python -B -m
          barreiras_collectors.commands.audit_tcm_ba_document_batch
          --competence "$TCM_COMPETENCE"

      - name: Derivar texto página a página
        if: steps.plan.outputs.competence != ''
        env:
          DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
          SUPABASE_URL: ${{ vars.QUERIDO_DIARIO_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.QUERIDO_DIARIO_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_WORKLOAD_EMAIL: ${{ secrets.MUNICIPAL_TRANSPARENCY_SUPABASE_WORKLOAD_EMAIL }}
          SUPABASE_WORKLOAD_PASSWORD: ${{ secrets.MUNICIPAL_TRANSPARENCY_SUPABASE_WORKLOAD_PASSWORD }}
          TCM_MAX_DOCUMENTS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_documents || '5' }}
        run: >-
          python -B -m
          barreiras_docproc.commands.process_tcm_ba_documents
          --limit "$TCM_MAX_DOCUMENTS"

      - name: OCR das páginas escaneadas do TCM-BA
        if: steps.plan.outputs.competence != ''
        env:
          DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
          SUPABASE_URL: ${{ vars.QUERIDO_DIARIO_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.QUERIDO_DIARIO_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_WORKLOAD_EMAIL: ${{ secrets.MUNICIPAL_TRANSPARENCY_SUPABASE_WORKLOAD_EMAIL }}
          SUPABASE_WORKLOAD_PASSWORD: ${{ secrets.MUNICIPAL_TRANSPARENCY_SUPABASE_WORKLOAD_PASSWORD }}
        run: >-
          python -B -m
          barreiras_docproc.commands.ocr_gazette_pages
          --source tcm-ba
          --limit-pages 30

      - name: Conferir cobertura de páginas e OCR
        if: steps.plan.outputs.competence != ''
        env:
          DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
        run: >-
          python -B -m
          barreiras_docproc.commands.report_tcm_ba_document_processing

      - name: Inventariar famílias documentais pela categoria oficial
        env:
          DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
        run: >-
          python -B -m
          barreiras_docproc.commands.process_tcm_ba_document_families
          --limit 50

      - name: Reconciliar cobertura privada das famílias documentais
        env:
          DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
        run: >-
          python -B -m
          barreiras_docproc.commands.report_tcm_ba_document_families

      - name: Segmentar contratos e aditivos em área privada
        env:
          DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
          TCM_MAX_DOCUMENTS: ${{ inputs.max_documents }}
        run: >-
          python -B -m
          barreiras_docproc.commands.process_tcm_ba_contract_documents
          --limit "$TCM_MAX_DOCUMENTS"

      - name: Reconciliar cobertura privada dos segmentos contratuais
        env:
          DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
        run: >-
          python -B -m
          barreiras_docproc.commands.report_tcm_ba_contract_documents

      - name: Extrair campos privados de contratos com citações
        env:
          DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
          TCM_MAX_DOCUMENTS: ${{ inputs.max_documents }}
        run: >-
          python -B -m
          barreiras_docproc.commands.process_tcm_ba_contract_fields
          --limit "$TCM_MAX_DOCUMENTS"

      - name: Reconciliar cobertura privada dos campos contratuais
        env:
          DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
        run: >-
          python -B -m
          barreiras_docproc.commands.report_tcm_ba_contract_fields

      - name: Identificar candidatos privados de notas de empenho
        if: steps.plan.outputs.competence != ''
        env:
          DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
          TCM_MAX_DOCUMENTS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_documents || '5' }}
        run: >-
          python -B -m
          barreiras_docproc.commands.process_tcm_ba_commitments
          --limit "$TCM_MAX_DOCUMENTS"

      - name: Reconciliar cobertura privada dos candidatos de empenho
        if: steps.plan.outputs.competence != ''
        env:
          DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
        run: >-
          python -B -m
          barreiras_docproc.commands.report_tcm_ba_commitments

      - name: Aprovar lote auditado
        if: steps.plan.outputs.competence != ''
        run: echo "TCM_BA_DOCUMENT_PILOT_APPROVED"
  process_existing:
    name: Processar candidatos no acervo TCM-BA já preservado
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'process_existing'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: workers/collectors/src:workers/document-processing/src
      PERSISTENCE_MODE: postgres-supabase
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências fixadas
        run: python -m pip install --disable-pip-version-check ".[postgres,pdf,ocr]"

      - name: Verificar CA oficial do Supabase
        run: >-
          echo "700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7  config/certificates/supabase-prod-ca-2021.crt"
          | sha256sum --check --strict

      - name: Conferir cobertura já preservada
        env:
          DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
        run: >-
          python -B -m
          barreiras_docproc.commands.report_tcm_ba_document_processing

      - name: Inventariar famílias documentais pela categoria oficial
        env:
          DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
        run: >-
          python -B -m
          barreiras_docproc.commands.process_tcm_ba_document_families
          --limit 50

      - name: Reconciliar cobertura privada das famílias documentais
        env:
          DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
        run: >-
          python -B -m
          barreiras_docproc.commands.report_tcm_ba_document_families

      - name: Segmentar contratos e aditivos em área privada
        env:
          DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
          TCM_MAX_DOCUMENTS: ${{ inputs.max_documents }}
        run: >-
          python -B -m
          barreiras_docproc.commands.process_tcm_ba_contract_documents
          --limit "$TCM_MAX_DOCUMENTS"

      - name: Reconciliar cobertura privada dos segmentos contratuais
        env:
          DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
        run: >-
          python -B -m
          barreiras_docproc.commands.report_tcm_ba_contract_documents

      - name: Extrair campos privados de contratos com citações
        env:
          DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
          TCM_MAX_DOCUMENTS: ${{ inputs.max_documents }}
        run: >-
          python -B -m
          barreiras_docproc.commands.process_tcm_ba_contract_fields
          --limit "$TCM_MAX_DOCUMENTS"

      - name: Reconciliar cobertura privada dos campos contratuais
        env:
          DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
        run: >-
          python -B -m
          barreiras_docproc.commands.report_tcm_ba_contract_fields

      - name: Identificar candidatos privados de notas de empenho
        env:
          DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
          TCM_MAX_DOCUMENTS: ${{ inputs.max_documents }}
        run: >-
          python -B -m
          barreiras_docproc.commands.process_tcm_ba_commitments
          --limit "$TCM_MAX_DOCUMENTS"

      - name: Reconciliar cobertura privada dos candidatos de empenho
        env:
          DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
        run: >-
          python -B -m
          barreiras_docproc.commands.report_tcm_ba_commitments

      - name: Aprovar processamento privado do backlog
        run: echo "TCM_BA_COMMITMENT_BACKLOG_APPROVED"
  process_pages:
    name: Derivar páginas do acervo TCM-BA já preservado
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'process_pages'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: workers/collectors/src:workers/document-processing/src
      PERSISTENCE_MODE: postgres-supabase
      SUPABASE_RAW_ARTIFACTS_BUCKET: raw-artifacts
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências fixadas
        run: python -m pip install --disable-pip-version-check ".[postgres,storage,pdf,ocr]"

      - name: Instalar OCR em português
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-por

      - name: Verificar CA oficial do Supabase
        run: >-
          echo "700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7  config/certificates/supabase-prod-ca-2021.crt"
          | sha256sum --check --strict

      - name: Derivar texto página a página
        env:
          DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
          SUPABASE_URL: ${{ vars.QUERIDO_DIARIO_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.QUERIDO_DIARIO_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_WORKLOAD_EMAIL: ${{ secrets.MUNICIPAL_TRANSPARENCY_SUPABASE_WORKLOAD_EMAIL }}
          SUPABASE_WORKLOAD_PASSWORD: ${{ secrets.MUNICIPAL_TRANSPARENCY_SUPABASE_WORKLOAD_PASSWORD }}
          TCM_MAX_DOCUMENTS: ${{ inputs.max_documents }}
        run: >-
          python -B -m
          barreiras_docproc.commands.process_tcm_ba_documents
          --limit "$TCM_MAX_DOCUMENTS"

      - name: OCR das páginas escaneadas do TCM-BA
        env:
          DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
          SUPABASE_URL: ${{ vars.QUERIDO_DIARIO_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.QUERIDO_DIARIO_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_WORKLOAD_EMAIL: ${{ secrets.MUNICIPAL_TRANSPARENCY_SUPABASE_WORKLOAD_EMAIL }}
          SUPABASE_WORKLOAD_PASSWORD: ${{ secrets.MUNICIPAL_TRANSPARENCY_SUPABASE_WORKLOAD_PASSWORD }}
        run: >-
          python -B -m
          barreiras_docproc.commands.ocr_gazette_pages
          --source tcm-ba
          --limit-pages 30

      - name: Conferir cobertura de páginas e OCR
        env:
          DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
        run: >-
          python -B -m
          barreiras_docproc.commands.report_tcm_ba_document_processing

      - name: Inventariar famílias documentais pela categoria oficial
        env:
          DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
        run: >-
          python -B -m
          barreiras_docproc.commands.process_tcm_ba_document_families
          --limit 50

      - name: Reconciliar cobertura privada das famílias documentais
        env:
          DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
        run: >-
          python -B -m
          barreiras_docproc.commands.report_tcm_ba_document_families

      - name: Segmentar contratos e aditivos em área privada
        env:
          DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
          TCM_MAX_DOCUMENTS: ${{ inputs.max_documents }}
        run: >-
          python -B -m
          barreiras_docproc.commands.process_tcm_ba_contract_documents
          --limit "$TCM_MAX_DOCUMENTS"

      - name: Reconciliar cobertura privada dos segmentos contratuais
        env:
          DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
        run: >-
          python -B -m
          barreiras_docproc.commands.report_tcm_ba_contract_documents

      - name: Extrair campos privados de contratos com citações
        env:
          DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
          TCM_MAX_DOCUMENTS: ${{ inputs.max_documents }}
        run: >-
          python -B -m
          barreiras_docproc.commands.process_tcm_ba_contract_fields
          --limit "$TCM_MAX_DOCUMENTS"

      - name: Reconciliar cobertura privada dos campos contratuais
        env:
          DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
        run: >-
          python -B -m
          barreiras_docproc.commands.report_tcm_ba_contract_fields

      - name: Identificar candidatos privados de notas de empenho
        env:
          DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
          TCM_MAX_DOCUMENTS: ${{ inputs.max_documents }}
        run: >-
          python -B -m
          barreiras_docproc.commands.process_tcm_ba_commitments
          --limit "$TCM_MAX_DOCUMENTS"

      - name: Reconciliar cobertura privada dos candidatos de empenho
        env:
          DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
        run: >-
          python -B -m
          barreiras_docproc.commands.report_tcm_ba_commitments

      - name: Aprovar páginas preservadas e candidatos privados
        run: echo "TCM_BA_PRESERVED_PAGES_APPROVED"
