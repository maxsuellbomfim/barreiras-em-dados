name: Completar histórico mensal da folha

on:
  workflow_dispatch:
    inputs:
      start_month:
        description: "Primeira competência do lote (AAAA-MM)"
        required: true
        default: "2024-03"
        type: string
      end_month:
        description: "Última competência do lote (AAAA-MM)"
        required: true
        default: "2024-08"
        type: string
      max_months:
        description: "Limite defensivo de competências no lote"
        required: true
        default: "6"
        type: choice
        options:
          - "1"
          - "3"
          - "6"

permissions:
  contents: read

env:
  APP_ENV: production
  LOG_LEVEL: INFO
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONPATH: workers/collectors/src:workers/document-processing/src:workers/normalization/src
  PERSISTENCE_MODE: postgres-supabase
  SUPABASE_RAW_ARTIFACTS_BUCKET: raw-artifacts

jobs:
  plan:
    name: Validar janela histórica
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      months: ${{ steps.window.outputs.months }}
      count: ${{ steps.window.outputs.count }}
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validar janela mensal e ordenar competências
        id: window
        env:
          START_MONTH: ${{ inputs.start_month }}
          END_MONTH: ${{ inputs.end_month }}
          MAX_MONTHS: ${{ inputs.max_months }}
        shell: bash
        run: |
          set -euo pipefail
          python -B -m barreiras_collectors.commands.plan_payroll_backfill \
            --start-month "$START_MONTH" \
            --end-month "$END_MONTH" \
            --max-months "$MAX_MONTHS" \
            --github-output "$GITHUB_OUTPUT"

  collect:
    name: Preservar PDFs oficiais
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: municipal-finance-collection-production
      cancel-in-progress: false
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências fixadas de coleta
        run: python -m pip install --disable-pip-version-check ".[postgres,storage]"

      - name: Verificar CA oficial do Supabase
        run: >-
          echo "700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7  config/certificates/supabase-prod-ca-2021.crt"
          | sha256sum --check --strict

      - name: Preservar todos os PDFs regulares correspondentes
        env:
          MONTHS: ${{ needs.plan.outputs.months }}
          DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
          SUPABASE_URL: ${{ vars.QUERIDO_DIARIO_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.QUERIDO_DIARIO_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_WORKLOAD_EMAIL: ${{ secrets.MUNICIPAL_TRANSPARENCY_SUPABASE_WORKLOAD_EMAIL }}
          SUPABASE_WORKLOAD_PASSWORD: ${{ secrets.MUNICIPAL_TRANSPARENCY_SUPABASE_WORKLOAD_PASSWORD }}
          MUNICIPAL_TRANSPARENCY_REQUESTS_PER_MINUTE: "10"
          MUNICIPAL_TRANSPARENCY_MAX_BODY_BYTES: "16777216"
          MUNICIPAL_TRANSPARENCY_DOCUMENT_REQUESTS_PER_MINUTE: "6"
          MUNICIPAL_TRANSPARENCY_MAX_DOCUMENT_BYTES: "268435456"
          MUNICIPAL_TRANSPARENCY_MAX_BATCH_DOCUMENT_BYTES: "67108864"
        shell: bash
        run: |
          set -euo pipefail
          for month in $MONTHS; do
            echo "Preservando competência $month"
            python -B -m barreiras_collectors.commands.collect_municipal_transparency \
              --source prefeitura \
              --resource servidores \
              --limit 500 \
              --max-pages 20 \
              --max-documents 20 \
              --download-documents \
              --document-reference-month "$month" \
              --document-type "1" \
              --allow-untyped-document-title "Relação de Servidores" \
              --require-document-match
          done

  publish:
    name: Validar e publicar competências
    needs: [plan, collect]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: municipal-finance-publication-production
      cancel-in-progress: false
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências fixadas de publicação
        run: python -m pip install --disable-pip-version-check ".[postgres,storage,pdf,ocr]"

      - name: Instalar OCR em português
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends tesseract-ocr tesseract-ocr-por

      - name: Verificar CA oficial do Supabase
        run: >-
          echo "700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7  config/certificates/supabase-prod-ca-2021.crt"
          | sha256sum --check --strict

      - name: Publicar somente competências comprovadamente válidas
        env:
          MONTHS: ${{ needs.plan.outputs.months }}
          DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
          SUPABASE_URL: ${{ vars.QUERIDO_DIARIO_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.QUERIDO_DIARIO_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_WORKLOAD_EMAIL: ${{ secrets.MUNICIPAL_TRANSPARENCY_SUPABASE_WORKLOAD_EMAIL }}
          SUPABASE_WORKLOAD_PASSWORD: ${{ secrets.MUNICIPAL_TRANSPARENCY_SUPABASE_WORKLOAD_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for month in $MONTHS; do
            year="${month%%-*}"
            echo "Validando e publicando competência $month"
            python -B -m barreiras_normalization.commands.publish_payroll_reports \
              --limit 20 \
              --fiscal-year-from "$year" \
              --fiscal-year-to "$year" \
              --reference-month "$month" \
              --require-complete-month
          done

  summary:
    name: Registrar resultado operacional
    if: ${{ always() }}
    needs: [plan, collect, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resumir execução sem dados sensíveis
        env:
          START_MONTH: ${{ inputs.start_month }}
          END_MONTH: ${{ inputs.end_month }}
          PLANNED_MONTHS: ${{ needs.plan.outputs.count }}
          PLAN_RESULT: ${{ needs.plan.result }}
          COLLECT_RESULT: ${{ needs.collect.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        shell: bash
        run: |
          {
            echo "### Backfill mensal da folha"
            echo
            echo "- Janela solicitada: ${START_MONTH} a ${END_MONTH}"
            echo "- Competências planejadas: ${PLANNED_MONTHS:-0}"
            echo "- Planejamento: ${PLAN_RESULT}"
            echo "- Preservação: ${COLLECT_RESULT}"
            echo "- Publicação: ${PUBLISH_RESULT}"
            echo "- Sucesso exige PDF oficial correspondente e competência presente na projeção pública determinística."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PLAN_RESULT" != "success" \
            || "$COLLECT_RESULT" != "success" \
            || "$PUBLISH_RESULT" != "success" ]]; then
            echo "Uma etapa obrigatória do backfill não foi concluída." >&2
            exit 1
          fi
