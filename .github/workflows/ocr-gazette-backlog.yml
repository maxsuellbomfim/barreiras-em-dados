name: Drenar OCR do Diário Oficial

# Em 22/09/2026, 15.133 páginas de 309 edições tinham como texto extraído
# apenas o número da página. O coletor diário faz OCR de 30 páginas por
# execução (~72 dias para zerar a fila); este dreno processa até 200 páginas
# a cada 30 minutos e reorganiza em seguida as edições que ganharam texto.
# Páginas OCR são gravadas com idempotência por artefato, página e versão do
# extrator, então rodar ao mesmo tempo que o coletor diário não duplica nada.

on:
  schedule:
    - cron: "47,17 * * * *"
  workflow_dispatch:
    inputs:
      limit_pages:
        description: "Máximo de páginas com OCR nesta execução (1 a 200)"
        required: false
        default: "200"
        type: string

permissions:
  contents: read

concurrency:
  group: ocr-gazette-backlog-production
  cancel-in-progress: false

jobs:
  drain:
    name: OCR e reorganização das edições
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: workers/collectors/src:workers/document-processing/src
      PERSISTENCE_MODE: postgres-supabase
      DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
      SUPABASE_URL: ${{ vars.QUERIDO_DIARIO_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.QUERIDO_DIARIO_SUPABASE_PUBLISHABLE_KEY }}
      # Mesma identidade do coletor que gravou os PDFs no bucket privado.
      SUPABASE_WORKLOAD_EMAIL: ${{ secrets.QUERIDO_DIARIO_SUPABASE_WORKLOAD_EMAIL }}
      SUPABASE_WORKLOAD_PASSWORD: ${{ secrets.QUERIDO_DIARIO_SUPABASE_WORKLOAD_PASSWORD }}
      SUPABASE_RAW_ARTIFACTS_BUCKET: raw-artifacts
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências fixadas
        run: python -m pip install --disable-pip-version-check ".[postgres,storage,pdf,ocr]"

      - name: Instalar Tesseract em português
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-por

      - name: Verificar CA oficial do Supabase
        run: >-
          echo "700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7
          config/certificates/supabase-prod-ca-2021.crt"
          | sha256sum --check --strict

      - name: OCR das páginas sem texto útil
        env:
          LIMIT_PAGES: ${{ inputs.limit_pages || '200' }}
        run: >-
          python -B -m barreiras_docproc.commands.ocr_gazette_pages
          --limit-pages "${LIMIT_PAGES}"

      - name: Reorganizar as edições que ganharam texto
        run: >-
          python -B -m barreiras_docproc.commands.segment_gazette_editions
          --limit 50

      # Só entram edições com todas as páginas atendidas por OCR ou texto
      # útil. Os candidatos vão para a fila interna; publicação segue os
      # gates dos workflows de coleta (revisão assistida e conferência
      # literal, ADR 0012).
      - name: Procurar atos nas edições com texto recuperado
        run: >-
          python -B -m barreiras_docproc.commands.process_gazette_acts
          --limit 20
