name: Processar atos do Diário Oficial

on:
  schedule:
    # Reprocessa o acervo já preservado sem depender de uma nova coleta.
    # A idempotência impede duplicação quando roda junto da coleta diária.
    - cron: "17 23 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Máximo de documentos por execução"
        required: false
        default: "100"
        type: string

permissions:
  contents: read

concurrency:
  group: process-gazette-acts-production
  cancel-in-progress: false

jobs:
  process:
    name: Extrair e publicar atos verificáveis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: workers/collectors/src:workers/document-processing/src
      PERSISTENCE_MODE: postgres-supabase
      DATABASE_URL: ${{ secrets.QUERIDO_DIARIO_DATABASE_URL }}
      SUPABASE_URL: ${{ vars.QUERIDO_DIARIO_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.QUERIDO_DIARIO_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_WORKLOAD_EMAIL: ${{ secrets.MUNICIPAL_TRANSPARENCY_SUPABASE_WORKLOAD_EMAIL }}
      SUPABASE_WORKLOAD_PASSWORD: ${{ secrets.MUNICIPAL_TRANSPARENCY_SUPABASE_WORKLOAD_PASSWORD }}
      SUPABASE_RAW_ARTIFACTS_BUCKET: raw-artifacts
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - name: Baixar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências fixadas
        run: python -m pip install --disable-pip-version-check ".[postgres,storage,pdf,ocr]"

      - name: Instalar Tesseract em português
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-por

      - name: Verificar CA oficial do Supabase
        run: >-
          echo "700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7
          config/certificates/supabase-prod-ca-2021.crt"
          | sha256sum --check --strict

      - name: OCR das páginas escaneadas
        run: >-
          python -B -m barreiras_docproc.commands.ocr_gazette_pages
          --limit-pages 60

      - name: Extrair atos desde 2021 preservados
        run: >-
          python -B -m barreiras_docproc.commands.process_gazette_acts
          --limit "${{ inputs.limit || '100' }}"

      - name: Sugerir leitura em cascata
        continue-on-error: true
        run: >-
          python -B -m barreiras_docproc.commands.assist_extraction_candidates
          --limit 50

      - name: Publicar somente campos conferidos literalmente
        run: >-
          python -B -m barreiras_docproc.commands.publish_verified_candidates
          --limit 50
