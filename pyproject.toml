[project]
name = "barreiras-em-dados"
version = "0.0.0"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["ruff==0.15.22"]
postgres = ["psycopg[binary]==3.3.4"]
storage = ["supabase==2.31.0"]
pdf = ["pypdf==6.14.2"]
ocr = ["pypdfium2==5.12.1", "Pillow==12.3.0"]
anydoc = ["firecrawl-anydoc==0.1.2"]

[tool.setuptools]
package-dir = {"" = "workers/collectors/src"}

[tool.setuptools.packages.find]
where = ["workers/collectors/src"]
include = ["barreiras_collectors*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = [
  "workers/collectors/src",
  "workers/document-processing/src",
  "workers/normalization/src",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
